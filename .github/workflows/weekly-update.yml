name: Weekly NWGS Grid update

on:
  schedule:
    - cron: "17 13 * * 6"   # Saturdays 13:17 UTC (8:17 a.m. Central), after CDC's weekly NWSS refresh
  workflow_dispatch:         # "Run workflow" button for manual runs

permissions:
  contents: write     # lets the run publish a Release (the permanent archive)
  pages: write
  id-token: write

concurrency:
  group: nwgs-weekly
  cancel-in-progress: false

env:
  NWGS_ROOT: /content/NWGS_GRID                 # same paths the Colab script uses
  TABLE_DIR: /content/NWGS_GRID/outputs/tables

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Prepare Colab-style folders
        run: |
          sudo mkdir -p "$NWGS_ROOT"
          sudo chown -R "$USER" /content
          mkdir -p "$NWGS_ROOT/data" "$TABLE_DIR"
          # Files the pipeline does not download itself (SVI, TIGER, AMR, etc.)
          if [ -d static_inputs ]; then cp -r static_inputs/. "$NWGS_ROOT/data/"; fi

      - name: Download Census TIGER/Line 2025 counties (too large for GitHub, ~130 MB)
        if: hashFiles('pipeline/nwgs_pipeline.py') != ''
        run: |
          curl -fsSL --retry 3 -A "Mozilla/5.0 (NWGS Grid weekly build)" \
            -o /tmp/tl_2025_us_county.zip \
            https://www2.census.gov/geo/tiger/TIGER2025/COUNTY/tl_2025_us_county.zip
          unzip -o -q /tmp/tl_2025_us_county.zip -d "$NWGS_ROOT/data/"
          ls -la "$NWGS_ROOT/data/"

      - name: Set the data window to end on today's date
        run: echo "NWGS_STUDY_END=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Run surveillance pipeline
        if: hashFiles('pipeline/nwgs_pipeline.py') != ''
        env:
          NWGS_PROJECT_ROOT: /content/NWGS_GRID
          NWGS_STATIC_ROOT: /content/NWGS_GRID/data
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          SOCRATA_KEY_ID: ${{ secrets.SOCRATA_KEY_ID }}
          SOCRATA_KEY_SECRET: ${{ secrets.SOCRATA_KEY_SECRET }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: python pipeline/nwgs_pipeline.py 2>&1 | tee pipeline_log.txt

      - name: Export app data (stops here if validation fails or tables are from mixed runs)
        if: hashFiles('pipeline/nwgs_pipeline.py') != ''
        run: python scripts/nwgs_app_export.py "$TABLE_DIR" app_export

      - name: Use the saved Oct 9 export until the pipeline is added
        if: hashFiles('pipeline/nwgs_pipeline.py') == ''
        run: cp -r sample_export app_export

      - name: Build site
        env:
          NWGS_STRUCTURE_DIR: /content/NWGS_GRID/outputs/pathogen_intelligence/protein_structures
        run: |
          python scripts/build_site.py app_export site
          cp site_src/CNAME site/ 2>/dev/null || true

      - name: Keep this run's export (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-export-${{ github.run_number }}
          path: |
            app_export/manifest.json
            app_export/*.csv
            pipeline_log.txt
            /content/NWGS_GRID/outputs/tables/
          if-no-files-found: ignore
          retention-days: 90

      - name: Archive this run as a permanent GitHub Release
        if: success() && hashFiles('pipeline/nwgs_pipeline.py') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CREDIT_LINE: "Victoria Love Franklin — Developer · PhD Student, Data Science · Research Scholar"
        shell: bash
        run: |
          RUN_ID=$(python -c "import json;print(json.load(open('app_export/manifest.json'))['run_id'])")
          AS_OF=$(python -c "import json;print(json.load(open('app_export/manifest.json'))['data_as_of'])")
          GATE=$(python -c "import json;print(json.load(open('app_export/manifest.json'))['gate_status'])")
          TAG="${RUN_ID}-r${{ github.run_number }}"
          mkdir -p release
          (cd /content/NWGS_GRID/outputs && zip -q -r "$GITHUB_WORKSPACE/release/${RUN_ID}_tables.zip" tables)
          (cd /content/NWGS_GRID/outputs && zip -q -r "$GITHUB_WORKSPACE/release/${RUN_ID}_figures.zip" . -x 'tables/*')
          (cd app_export && zip -q -r "$GITHUB_WORKSPACE/release/${RUN_ID}_app_export.zip" .)
          cp app_export/manifest.json "release/${RUN_ID}_manifest.json"
          cp pipeline_log.txt "release/${RUN_ID}_pipeline_log.txt"
          ls -la release
          {
            echo "Frozen snapshot from the weekly NWGS Grid™ run."
            echo
            echo "**Prepared by ${CREDIT_LINE}**"
            echo
            echo "Contact, license requests and feedback: victorialovefranklin@gmail.com"
            echo
            echo "- Run ID: \`${RUN_ID}\`"
            echo "- Data through: ${AS_OF}"
            echo "- Validation gate: ${GATE}"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Cite tables and figures from one release only; CDC data changes every week."
            echo
            echo "**How to cite:** Franklin, V. L. (${AS_OF:0:4}). *NWGS Grid™: National Wastewater Genomic Surveillance Grid* (data through ${AS_OF}, release ${TAG}) [Software and dataset]. ${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
            echo
            echo "Copyright © 2026 Victoria Love Franklin. All rights reserved. No reuse without written permission; see LICENSE. Underlying CDC, Census, NCBI and RCSB data remain subject to their providers' terms."
          } > release/notes.md
          cp LICENSE release/LICENSE.txt
          gh release create "$TAG" release/*.zip release/*.json release/*.txt \
            --title "Data through ${AS_OF} (${RUN_ID})" --notes-file release/notes.md --target "$GITHUB_SHA"

      - name: Email saved alerts (Supabase)
        if: success() && hashFiles('pipeline/nwgs_pipeline.py') != ''
        continue-on-error: true      # an email problem never blocks the site update
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        shell: bash
        run: |
          RUN_ID=$(python -c "import json;print(json.load(open('app_export/manifest.json'))['run_id'])")
          export RELEASE_TAG="${RUN_ID}-r${{ github.run_number }}"
          python scripts/send_alerts.py app_export

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
