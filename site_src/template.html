<title>NWGS Grid™ · Victoria Love Franklin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab console — fixed left rail of views, a run-status strip across the top, data panels in a 12-col grid */
:root{
  /* NWGS Grid™ brand (Victoria Love Franklin signature palette): navy, wine, gold on paper */
  --navy:#14213a; --navy-2:#1c2c4c; --wine:#6e1f2b; --gold:#c49a4a; --gold-soft:#f0cf8f; --paper:#fbf8f3; --cream:#f7f1e8;
  --bg:#ffffff; --surface:#ffffff; --ink:#14213a; --muted:#262b36; --line:#e7e4de;
  --accent:#1c2c4c; --accent-ink:#ffffff; --accent-soft:#e7ebf3; --link:#1c2c4c;
  --rail-bg:#ffffff; --rail-ink:#14213a; --rail-muted:#262b36; --rail-hover:#f5f3ef; --rail-active:rgba(196,154,74,.16); --rail-line:#e7e4de; --count-ink:#6e1f2b; --count-bg:rgba(196,154,74,.18); --brand-accent:#1d4f91;
  --nodata:#e8e6e1; --typ:#f4f3ef; --typ-line:#bdb8ad; --hi-soft:#f5cdc6;
  --vl:#2166ac; --lo:#67a9cf; --el:#ef8a62; --hi:#b2182b; --warn:#b4630f; --ok:#2e7d4f;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1424; --surface:#131d33; --ink:#f2ece2; --muted:#a9b0c0; --line:#27324b;
  --accent:#e0bd74; --accent-ink:#14213a; --accent-soft:#25304a; --link:#f0cf8f;
  --rail-bg:#09101f; --rail-ink:#f2ece2; --rail-muted:#9aa3b5; --rail-hover:rgba(242,236,226,.07); --rail-active:rgba(224,189,116,.18); --rail-line:#27324b; --count-ink:#f0cf8f; --count-bg:rgba(196,154,74,.16); --brand-accent:#e0bd74;
  --nodata:#283247; --typ:#8e95a3; --typ-line:#8e95a3; --hi-soft:#4d2630;
  --vl:#4f8fd0; --lo:#8cc3e0; --el:#f09a76; --hi:#e2525a; --warn:#e3a14e; --ok:#5fbf86; color-scheme:dark}}
:root[data-theme="dark"] .fulllogo{background:#fff;padding:8px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fulllogo{background:#fff;padding:8px}}
:root[data-theme="dark"]{
  --bg:#0c1424; --surface:#131d33; --ink:#f2ece2; --muted:#a9b0c0; --line:#27324b;
  --accent:#e0bd74; --accent-ink:#14213a; --accent-soft:#25304a; --link:#f0cf8f;
  --rail-bg:#09101f; --rail-ink:#f2ece2; --rail-muted:#9aa3b5; --rail-hover:rgba(242,236,226,.07); --rail-active:rgba(224,189,116,.18); --rail-line:#27324b; --count-ink:#f0cf8f; --count-bg:rgba(196,154,74,.16); --brand-accent:#e0bd74;
  --nodata:#283247; --typ:#8e95a3; --typ-line:#8e95a3; --hi-soft:#4d2630;
  --vl:#4f8fd0; --lo:#8cc3e0; --el:#f09a76; --hi:#e2525a; --warn:#e3a14e; --ok:#5fbf86; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration-color:color-mix(in srgb,var(--gold) 70%,transparent);text-underline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.005em;text-wrap:pretty;margin:0;font-optical-sizing:auto;text-align:left}
h1{font-size:2rem;line-height:1.12}
h2{font-size:1.25rem}
h3{font-size:1rem;font-weight:600;font-family:var(--body)}
p{margin:0;text-wrap:pretty}
li{text-wrap:pretty}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font:600 .7rem/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--rail-bg);color:var(--rail-ink);padding:20px 14px;display:flex;flex-direction:column;gap:18px;border-top:3px solid var(--gold);border-right:1px solid var(--rail-line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none;color:inherit}
.brand svg{flex:none}
.fulllogo{display:block;width:100%;max-width:184px;height:auto;margin:0 auto;border-radius:10px}
.rail .brand{justify-content:center}
.rail .brand .markbadge,.rail .brand .wm{display:none}
.markbadge{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--gold)}
.markbadge img{width:34px;height:auto;display:block}
.wlogo{width:min(220px,60%);height:auto;display:block;margin:0 0 4px}
.brand .wm{display:flex;flex-direction:column;gap:3px}
.brand b{font:700 1.4rem/1 var(--display);letter-spacing:.005em;color:var(--rail-ink)}
.brand b span{color:var(--brand-accent,#1d4f91)}
.brand b sup{font:500 .55rem var(--body);color:var(--rail-muted);margin-left:1px}
.brand small{color:var(--rail-muted);font-size:.72rem;line-height:1.3}
.menubtn{display:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px 8px 12px;border-radius:6px;font-size:.9rem;color:var(--rail-muted);display:flex;justify-content:space-between;align-items:center;border-left:3px solid transparent}
.nav button:hover{color:var(--rail-ink);background:var(--rail-hover)}
.nav button[aria-current="page"]{background:var(--rail-active);color:var(--rail-ink);font-weight:600;border-left-color:var(--gold)}
.nav button:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.nav .count{font:500 .72rem var(--mono);color:var(--count-ink);background:var(--count-bg);padding:1px 7px;border-radius:999px}
.rail .foot{margin-top:auto;font-size:.72rem;color:var(--rail-muted);padding:0 8px;line-height:1.5}
.sitefoot{margin-top:12px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:center;text-align:center;gap:4px 18px;font-size:.78rem;color:var(--muted)}
.acct{margin-left:0}
.acct button{all:unset;cursor:pointer;font-size:.82rem;color:var(--accent);font-weight:600}
.acct button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.form{display:grid;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.form input,.form select,.form textarea{font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
.form textarea{min-height:90px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.msg{font-size:.84rem;padding:8px 10px;border-radius:var(--r);border:1px solid var(--line)}
.msg.ok{border-color:var(--ok);color:var(--ok)} .msg.err{border-color:var(--hi);color:var(--hi)}
button.btn{cursor:pointer;font-family:inherit}
button.btn[disabled]{opacity:.6;cursor:default}
.btn.small{padding:4px 9px;font-size:.78rem}
details>summary.btn{list-style:none}
details>summary.btn::-webkit-details-marker{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);text-decoration:none;font-size:.86rem;font-weight:500}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:none}
.opt details{align-self:stretch}
.stackcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.sumrow{display:flex;gap:28px}.sumrow div{display:flex;flex-direction:column;gap:4px}
.linkbtn{all:unset;cursor:pointer;color:var(--link);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:2px}
.linkbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.selectwrap select{font:inherit;font-size:.86rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.statecards{display:flex;flex-direction:column;gap:12px}
.statecards .grid{align-items:stretch}
.filterbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.9rem}
.statecard .pblock{display:flex;flex-direction:column;gap:3px}
.statecard .ptitle{font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:7px}
.statecard .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.statecard .btn{align-self:flex-start;margin-top:auto}
/* County chips: name left, z-score right, aligned down the column so the
   numbers can be compared at a glance instead of read as prose. */
/* County rows: name left, z-score right, aligned down each column so values
   can be compared by eye. No fills or outlines — severity is carried by the
   weight and colour of the number itself, which keeps a card with fourteen
   counties calm rather than making it a field of coloured tags. */
.clist{list-style:none;margin:3px 0 0;padding:0;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0 18px}
.clist li{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:3px 0;border-bottom:1px solid var(--hair);font-size:.82rem;min-width:0}
.clist .cname{overflow-wrap:anywhere;color:var(--ink)}
.clist .cz{font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.clist li.z2 .cz{color:#9c4f10;font-weight:600}
.clist li.z3 .cz{color:#8c1f1f;font-weight:700}
.zkey{font-variant-numeric:tabular-nums}
.zkey.z2{color:#9c4f10;font-weight:600}
.zkey.z3{color:#8c1f1f;font-weight:700}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .clist li.z2 .cz,:root:not([data-theme="light"]) .zkey.z2{color:#e8b07a}
  :root:not([data-theme="light"]) .clist li.z3 .cz,:root:not([data-theme="light"]) .zkey.z3{color:#e8a0a0}
}

.statecard{height:100%}
.banner{margin:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#e9eef6}
.banner img{display:block;width:100%;height:auto;aspect-ratio:1400/349;object-fit:cover;object-position:left center}
.portrait{padding:0;overflow:hidden;margin:0}
.portrait img{display:block;width:100%;height:100%;aspect-ratio:3/4;object-fit:cover;object-position:center 20%}
.role{font-weight:600;color:var(--wine)}
.why .lede{font:500 1.2rem/1.45 var(--display);color:var(--ink)}
.why .sig{font:italic 500 1.05rem var(--display);color:var(--muted)}
.creds{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.creds li::marker{color:var(--gold)}
.creds+h3{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.refs{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:.86rem}
.refs li{overflow-wrap:anywhere}
.refs li::marker{color:var(--gold);font-weight:600}
/* Structure cards: a fixed-ratio figure so every card has the same silhouette
   whether or not its rendered image is present, a clear name block, a compact
   spec row, then the regions and the actions. */
.scard{gap:10px}
.scard .sfig{position:relative;margin:-18px -20px 2px;border-bottom:1px solid var(--line);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;border-radius:var(--r) var(--r) 0 0;overflow:hidden;background:linear-gradient(160deg,#f7f4ee 0%,#eef1f6 55%,#e7ecf4 100%)}
.scard .sfig img{position:relative;max-width:100%;max-height:100%;object-fit:contain;display:block;z-index:1}
.scard .sfig img[hidden]{display:none}
.sfig-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--navy-2,#1c2c4c);opacity:.17;font-size:1.6rem;letter-spacing:.14em;font-weight:600}
.sfig-tag{position:absolute;right:8px;bottom:8px;z-index:2;background:rgba(20,33,58,.86);color:#f7f1e8;font-size:.68rem;letter-spacing:.03em;padding:3px 7px;border-radius:4px}
.shead{display:flex;flex-direction:column;gap:2px}
.shead h2{font-size:1.12rem}
.sprot{margin:0;font-weight:600;font-size:.92rem;color:var(--ink)}
.stitle{margin:0}
.sspec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:2px 0;padding:9px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sspec>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.sspec dt{font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sspec dd{margin:0;font-size:.88rem;font-weight:600;overflow-wrap:anywhere}
.sact{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto}
.btn.primary{background:var(--navy,#14213a);color:#f7f1e8;border-color:var(--navy,#14213a);font-weight:600}
.sref{margin:0;font-size:.74rem;overflow-wrap:anywhere}
.moldlg{width:min(1060px,96vw);padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.moldlg::backdrop{background:rgba(12,20,36,.6)}
.molhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.molbody{display:grid;grid-template-columns:minmax(0,1fr) 290px}
.molview{position:relative;width:100%;height:min(70vh,560px)}
.mollegend{border-left:1px solid var(--line);padding:14px;overflow:auto;height:min(70vh,560px);display:flex;flex-direction:column;gap:8px}
.mollegend h3{font-size:.95rem}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.mbtn{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"sw nm" "sw res";gap:1px 8px;padding:6px 8px;border-radius:6px;border:1px solid transparent;font-size:.83rem}
.mbtn:hover{background:var(--count-bg)}
.mbtn.on{background:var(--count-bg);border-color:var(--gold)}
.mbtn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.msw{grid-area:sw;align-self:center;width:12px;height:12px;border-radius:3px}
.mnm{grid-area:nm;overflow-wrap:anywhere}
.mbtn .rres{grid-area:res}
@media (max-width:760px){.molbody{grid-template-columns:1fr}.molview{height:46vh}.mollegend{border-left:none;border-top:1px solid var(--line);height:auto;max-height:34vh}}
.emlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.emlist li{border-top:1px solid var(--line);padding-top:8px}
/* Column flow, not a grid: a grid forces every row to the height of its
   tallest panel, which leaves large empty gaps under the short sections. */
.glist{column-count:2;column-gap:12px}
.glist>.gsec{break-inside:avoid;page-break-inside:avoid;margin:0 0 12px;display:block}
.gsec dl{margin:0;display:flex;flex-direction:column}
.gitem{padding:7px 0;border-top:1px solid var(--line);scroll-margin:90px;transition:background .3s}
.gitem:first-child{border-top:none;padding-top:0}
.gsec{gap:8px;padding:14px 16px}
.gsec h2{margin:0;font-size:1.1rem}
.gitem.hl{padding-left:8px;padding-right:8px}
.gitem dt{font-weight:600;font-size:.92rem;line-height:1.3}
.gitem dd{margin:1px 0 0;font-size:.88rem;line-height:1.45;color:var(--muted)}
.gitem.hl{background:var(--count-bg);border-radius:6px}
.gsearch input{font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;width:min(420px,90vw)}
.gsearch input:focus{outline:2px solid var(--gold);outline-offset:0}
@media (max-width:1100px){.glist{column-count:1}}
.tapcue{display:flex;align-items:center;gap:10px;margin:0;padding:8px 12px;border-radius:999px;background:var(--count-bg);color:var(--ink);font-weight:600;font-size:.88rem;align-self:center}
.tapdot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(196,154,74,.6);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(196,154,74,.6)}70%{box-shadow:0 0 0 10px rgba(196,154,74,0)}100%{box-shadow:0 0 0 0 rgba(196,154,74,0)}}
.county.sel{stroke:var(--gold)!important;stroke-width:2.4!important}
.panel.selcard{border:2px solid var(--gold);box-shadow:0 2px 10px rgba(196,154,74,.18)}
.selcard .detail{min-height:0}
.selempty{margin:0;font-size:.9rem}
.selname{font:600 1.15rem var(--display);margin:0 0 6px}
.selrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.selrow>span:first-child{font-weight:600}
.regions{display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line);padding-top:12px}
.regions h3{font-size:.95rem}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto}
.rbtn{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"type name" "type res";align-items:center;gap:1px 8px;width:100%;padding:7px 8px;border-radius:6px;border:1px solid transparent;font-size:.84rem;box-sizing:border-box}
.rbtn:hover{background:var(--count-bg);border-color:var(--gold)}
.rbtn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.rname{grid-area:name;overflow-wrap:anywhere}
.rres{grid-area:res;font-size:.74rem;color:var(--muted);white-space:nowrap}
.rtype{grid-area:type;align-self:center;font:600 .62rem/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.rt-binding-site,.rt-active-site,.rt-functional-site{background:var(--count-bg);color:var(--count-ink)}
.rt-transmembrane,.rt-intramembrane,.rt-topological-domain,.rt-signal-peptide{background:var(--typ);color:var(--ink)}
.scope{max-width:none}
.pending{color:var(--warn);font-weight:500}
.dtable td{vertical-align:top;padding:12px 10px}
.dtable .dname{font-weight:600;white-space:normal;min-width:11rem}
.dtable td.small{max-width:26rem}
.tags{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tags li{font-size:.78rem;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.molhead #mol-r{display:block;font-weight:400;margin-top:2px}
.cite{font-size:.84rem;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;overflow-wrap:anywhere}

.main{min-width:0;padding-block:20px 48px;padding-inline:28px;display:flex;flex-direction:column;gap:22px}
.status{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px 16px;font-size:.82rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:12px}
.status .sinfo{grid-column:2;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 16px;text-align:center}
.status .acct{grid-column:3;justify-self:end;margin:0}
/* The visible mark stays small, but an invisible overlay gives it a 28px
   touch target so it is usable on a phone without changing the design. */
.qmark{all:unset;cursor:pointer;position:relative;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--line);font:600 .66rem var(--body);color:var(--muted)}
.qmark::after{content:'';position:absolute;top:50%;left:50%;width:28px;height:28px;transform:translate(-50%,-50%);border-radius:50%}
.qmark:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.qmark:hover{border-color:var(--gold);color:var(--ink)}
.status .opt-s{white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 .74rem var(--body);padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--surface);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pill.warn i{background:var(--warn)} .pill.ok i{background:var(--ok)} .pill.bad i{background:var(--hi)}
.status button.pill{cursor:pointer}

.view{display:flex;flex-direction:column;gap:20px}
.view[hidden]{display:none}
.head{display:flex;flex-direction:column;gap:8px;max-width:none;text-align:left}
.head p{text-wrap:pretty;font-size:1rem;max-width:none}
.head .eyebrow{font:600 .72rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 3px rgba(20,33,58,.05),0 1px 1px rgba(20,33,58,.03)}
/* Left-aligned body text everywhere, and no single word stranded alone
   on a final line. text-wrap:pretty asks the browser to avoid orphans. */
.panel p,.panel li,.note,.small,.muted{text-align:left}
p,li,dd,dt,td,th,figcaption,.detail,.arow,.amsg,.statecard,.stat{text-wrap:pretty}
.panel.flat{background:transparent;border:none;padding:0}
.panel header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

.card-p{display:flex;flex-direction:column;gap:10px}
.card-p .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 .72rem var(--body);letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid transparent}
.chip.sw{width:12px;height:12px;padding:0;border-radius:3px}
.big{font:600 clamp(1.4rem,5.2vw,2rem)/1.05 var(--display);font-variant-numeric:lining-nums tabular-nums;overflow-wrap:anywhere;min-width:0}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv b{font:500 .95rem var(--mono)}
.trend-up{color:var(--hi)} .trend-flat{color:var(--muted)} .trend-down{color:var(--vl)}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:.84rem;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}

.mapbox{width:100%;aspect-ratio:960/610;max-width:100%}
.mapbox svg{width:100%;height:100%;display:block}
.county{stroke:var(--surface);stroke-width:.25}
.county:hover{stroke:var(--ink);stroke-width:1}
.statebd{fill:none;stroke:var(--surface);stroke-width:.9;pointer-events:none}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--body)}
.chart .axis path,.chart .axis line{stroke:var(--line)}
.chart .gridl line{stroke:var(--line);stroke-opacity:.7}

.tbl{overflow-x:auto}
.tbl.scroll{max-height:460px;overflow-y:auto}
.tbl.scroll thead th,.tbl.scroll tr:first-child th{position:sticky;top:0;background:var(--panel,#fff);z-index:1}
.posterfig{margin:18px 0 10px;text-align:center}
.posterfig img{width:100%;max-width:1100px;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.posterfig figcaption{margin-top:8px;text-align:left}
.origin h3{margin-top:22px}
tr.unsup td{opacity:.62}
:root{--hair:rgba(20,33,58,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hair:rgba(247,241,232,.10)}}
#al-sum .statgrid{grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr))}
.natsig{display:flex;flex-direction:column;gap:8px}
.methodsteps{margin:4px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.methodsteps li{padding-left:4px}
.notloaded{border:1px solid var(--gold);border-left:4px solid var(--gold);background:var(--count-bg);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.notloaded p{margin:0;text-align:left}
.nl-head{font-weight:700;font-size:.98rem;color:var(--ink)}
.plain{background:var(--surface)}
.plain p{max-width:none;font-size:1.02rem;text-align:left}
.plainlist{max-width:none;margin:10px 0 12px;padding-left:20px;text-align:left}
.plainlist li{margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{font:600 .7rem var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.nw{white-space:nowrap}
.tight th{white-space:normal;vertical-align:bottom}
th .nocase{text-transform:none;letter-spacing:0;font-size:.8rem}
@media (max-width:600px){
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr:first-child{display:none}
  table.stack tr{padding:10px 0;border-bottom:1px solid var(--line)}
  table.stack tr:last-child{border-bottom:none}
  table.stack td{border:none;padding:2px 0;max-width:none!important;text-align:left}
  table.stack td[data-l]::before{content:attr(data-l);display:block;font:600 .66rem/1.6 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  table.stack td.lead{font-weight:600}
  table.stack td[data-l]{display:inline-block;width:auto;margin-right:22px;vertical-align:top}
  table.stack.dtable td[data-l]{display:block;width:100%;margin-right:0}
  table.stack.dtable tr{padding:14px 0}
}

.alert{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:none}
.alert .bar{border-radius:2px}
.alert .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:.76rem;color:var(--muted)}
.sev-high{background:var(--hi)} .sev-moderate{background:var(--warn)} .sev-info{background:var(--accent)}
.status-INFO{color:var(--muted)} .status-PASS{color:var(--ok)} .status-WARN{color:var(--warn)} .status-FAIL{color:var(--hi)}

.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.stat .label,.stat .small{overflow-wrap:anywhere}
.stat .mono{overflow-wrap:anywhere}
.note{font-size:.82rem;color:var(--muted);max-width:none;text-align:left}
.callout{border-left:3px solid var(--warn);padding:8px 12px;background:var(--surface);font-size:.86rem;border-radius:0 var(--r) var(--r) 0}
.detail{font-size:.88rem}
.flag{color:var(--warn);font-weight:600}

#tip{position:fixed;pointer-events:none;z-index:20;background:var(--ink);color:var(--bg);font-size:.78rem;line-height:1.35;padding:7px 9px;border-radius:5px;max-width:240px;opacity:0;transition:opacity .08s}
#tip b{font-weight:600}

@media (max-width:1100px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .main{padding-inline:22px}
  .c8,.c7,.c6,.c5{grid-column:span 12}.c4,.c3{grid-column:span 6}
  .c4.solo{grid-column:span 12}
  .brand b{font-size:1.15rem}
  .fulllogo{max-width:160px}
  .aboutgrid .portrait{grid-column:span 4}.aboutgrid .bio{grid-column:span 8}
}
@media (max-width:760px){
  .portrait img{aspect-ratio:4/5;max-height:440px}
  .aboutgrid .portrait,.aboutgrid .bio{grid-column:span 12}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:0;height:auto;max-height:100vh;z-index:30;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-top-width:3px}
  .brand b{font-size:1.2rem}
  .fulllogo{display:none}
  .rail .brand{justify-content:flex-start}
  .rail .brand .markbadge{display:grid}.rail .brand .wm{display:flex}
  .rail{border-right:none;border-bottom:1px solid var(--rail-line)}
  .markbadge{width:36px;height:36px}.markbadge img{width:28px}
  .brand small{display:none}
  .menubtn{display:inline-flex;align-items:center;gap:8px;all:unset;cursor:pointer;color:var(--rail-ink);font:600 .86rem var(--body);padding:7px 12px;border:1px solid var(--rail-line);border-radius:999px}
  .menubtn{display:inline-flex}
  .menubtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .nav{display:none;flex-basis:100%;padding:6px 0 10px;max-height:calc(100vh - 70px);overflow-y:auto}
  .rail.open .nav{display:flex}
  .nav button{font-size:1rem;padding:11px 12px}
  .rail .foot{display:none}
  .main{padding-inline:16px;padding-top:14px;gap:18px}
  .c8,.c7,.c6,.c5,.c4,.c3{grid-column:span 12}
  h1{font-size:1.6rem}
  .status{font-size:.78rem;gap:6px 12px}
  .status .opt-s{display:none}
  .status{grid-template-columns:1fr}
  .status .sinfo{grid-column:1}
  .status .acct{grid-column:1;justify-self:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script type="application/json" id="data">__DATA__</script>
<script type="application/json" id="topo">__TOPO__</script>
<script type="application/json" id="supa">__SUPA__</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const TOPO = JSON.parse(document.getElementById('topo').textContent);
const EMAIL = ['victorialovefranklin','gmail.com'].join('@');
const ROUTINE = ['SARS-CoV-2','RSV','Influenza A'];
const EMERGING = ['Influenza A(H5)','Measles','Mpox'];
const LEVELS = ['Very Low','Low','Typical','Elevated','High'];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const LV = {'Very Low':'--vl','Low':'--lo','Typical':'--typ','Elevated':'--el','High':'--hi'};
const level = z => z==null?null : z<=-1?'Very Low': z<=-0.25?'Low': z<=0.25?'Typical': z<=1?'Elevated':'High';
const lvColor = l => l? css(LV[l]) : css('--nodata');
const fmt = (x,d=2) => {if(x==null||isNaN(x))return '—';const s=Number(x).toFixed(d);return /^-0(\.0+)?$/.test(s)?s.slice(1):s};
const pct = (x,d=1) => x==null?'—':(x*100).toFixed(d)+'%';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pFmt = p => p==null||isNaN(p)?'—': p<0.001?'< 0.001': p<0.01?Number(p).toFixed(3):Number(p).toFixed(2);
const isoTxt = s => esc(s).replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g,(m)=>dateFmt(m));
const FEAT = f => {let m;
  if(f==='wastewater_index')return 'Wastewater, this week';
  if((m=f.match(/^ww_lag(\d+)$/)))return `Wastewater, ${m[1]} wk before`;
  if((m=f.match(/^clinical_lag(\d+)$/)))return `ED visits, ${m[1]} wk before`;
  if(f==='n_sites')return 'Number of sites';
  return f.replace(/_/g,' ')};
const dateFmt = s => s? new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
const STATE_FIPS = {'01':'AL','02':'AK','04':'AZ','05':'AR','06':'CA','08':'CO','09':'CT','10':'DE','11':'DC','12':'FL','13':'GA','15':'HI','16':'ID','17':'IL','18':'IN','19':'IA','20':'KS','21':'KY','22':'LA','23':'ME','24':'MD','25':'MA','26':'MI','27':'MN','28':'MS','29':'MO','30':'MT','31':'NE','32':'NV','33':'NH','34':'NJ','35':'NM','36':'NY','37':'NC','38':'ND','39':'OH','40':'OK','41':'OR','42':'PA','44':'RI','45':'SC','46':'SD','47':'TN','48':'TX','49':'UT','50':'VT','51':'VA','53':'WA','54':'WV','55':'WI','56':'WY'};

/* ---------- tooltip ---------- */
const tip = document.getElementById('tip');
function showTip(e,html){tip.innerHTML=html;tip.style.opacity=1;moveTip(e)}
function moveTip(e){const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.opacity=0}

/* ---------- geometry ---------- */
const counties = topojson.feature(TOPO, TOPO.objects.counties).features;
const statesMesh = topojson.mesh(TOPO, TOPO.objects.states, (a,b)=>a!==b);
const statesFeat = topojson.feature(TOPO, TOPO.objects.states).features;
const nationFeat = topojson.feature(TOPO, TOPO.objects.nation);
const path = d3.geoPath();

function countyMap(el, colorOf, tipOf, opts={}){
  el.innerHTML='';
  const feats = opts.filter? counties.filter(opts.filter) : counties;
  let vb='0 0 975 610';
  if(opts.fit){const b=d3.geoPath().bounds({type:'FeatureCollection',features:feats});const p=6;vb=`${b[0][0]-p} ${b[0][1]-p} ${b[1][0]-b[0][0]+2*p} ${b[1][1]-b[0][1]+2*p}`;el.style.aspectRatio=`${b[1][0]-b[0][0]+2*p}/${b[1][1]-b[0][1]+2*p}`}
  const svg=d3.select(el).append('svg').attr('viewBox',vb).attr('role','img').attr('aria-label',opts.label||'County map');
  svg.append('g').selectAll('path').data(feats).join('path').attr('class','county').attr('d',path)
    .attr('fill',d=>colorOf(d.id)).attr('stroke-width',opts.fit?.8:.25)
    .on('mouseenter',(e,d)=>showTip(e,tipOf(d.id))).on('mousemove',moveTip).on('mouseleave',hideTip)
    .on('click',(e,d)=>opts.onClick&&opts.onClick(d.id));
  if(!opts.fit) svg.append('path').attr('class','statebd').attr('d',path(statesMesh));
  return svg;
}
function stateMap(el, colorOf, tipOf){
  el.innerHTML='';
  const svg=d3.select(el).append('svg').attr('viewBox','0 0 975 610').attr('role','img').attr('aria-label','State map');
  svg.append('g').selectAll('path').data(statesFeat).join('path').attr('d',path).attr('stroke',css('--surface')).attr('stroke-width',1)
    .attr('fill',d=>colorOf(STATE_FIPS[d.id])).on('mouseenter',(e,d)=>showTip(e,tipOf(STATE_FIPS[d.id],d.properties.name))).on('mousemove',moveTip).on('mouseleave',hideTip);
}
const cname = f => {const n=D.names[f];return n?`${esc(n[0])}, ${esc(n[1])}`:`County ${f}`};

/* ---------- charts ---------- */
function lineChart(el, series, o={}){
  el.innerHTML='';
  const W=Math.max(300,el.clientWidth||o.w||720),H=Math.min(o.h||220,Math.max(180,W*.58)),m={t:10,r:14,b:24,l:o.left||38};
  const svg=d3.select(el).append('svg').attr('viewBox',`0 0 ${W} ${H}`);
  const all=series.flatMap(s=>s.values);
  const x=d3.scaleUtc().domain(d3.extent(all,d=>d[0])).range([m.l,W-m.r]);
  const ext=d3.extent(all,d=>d[1]); const lo=o.ymin??Math.min(ext[0],-1.2), hi=o.ymax??Math.max(ext[1],1.2);
  const y=d3.scaleLinear().domain([lo,hi]).nice().range([H-m.b,m.t]);
  if(o.bands){const b=[[-99,-1,'--vl'],[-1,-.25,'--lo'],[.25,1,'--el'],[1,99,'--hi']];
    b.forEach(([a,c,col])=>{const y0=y(Math.max(a,y.domain()[0])),y1=y(Math.min(c,y.domain()[1]));if(y0>y1)svg.append('rect').attr('x',m.l).attr('width',W-m.l-m.r).attr('y',y1).attr('height',y0-y1).attr('fill',css(col)).attr('opacity',.09)})}
  svg.append('g').attr('class','gridl').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(o.yticks||5).tickSize(-(W-m.l-m.r)).tickFormat(o.yfmt||d3.format('.1f'))).call(g=>g.select('.domain').remove()).call(g=>g.selectAll('text').attr('x',-6));
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).ticks(Math.max(2,Math.min(o.xticks||6,Math.floor(W/110)))).tickSizeOuter(0));
  if(o.zero) svg.append('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',y(0)).attr('y2',y(0)).attr('stroke',css('--muted')).attr('stroke-dasharray','2 3');
  series.forEach(s=>{
    if(s.area){svg.append('path').datum(s.values).attr('fill',s.color).attr('opacity',.12).attr('d',d3.area().x(d=>x(d[0])).y0(y(Math.max(0,y.domain()[0]))).y1(d=>y(d[1])).curve(d3.curveMonotoneX))}
    svg.append('path').datum(s.values).attr('fill','none').attr('stroke',s.color).attr('stroke-width',s.width||1.8).attr('d',d3.line().x(d=>x(d[0])).y(d=>y(d[1])).curve(d3.curveMonotoneX));
    const last=s.values[s.values.length-1];svg.append('circle').attr('cx',x(last[0])).attr('cy',y(last[1])).attr('r',3.2).attr('fill',s.color);
  });
  // hover
  const bis=d3.bisector(d=>d[0]).center; const g=svg.append('g').style('display','none');
  g.append('line').attr('y1',m.t).attr('y2',H-m.b).attr('stroke',css('--muted')).attr('stroke-dasharray','2 2');
  svg.append('rect').attr('x',m.l).attr('y',m.t).attr('width',W-m.l-m.r).attr('height',H-m.t-m.b).attr('fill','transparent')
    .on('mousemove',e=>{const [mx]=d3.pointer(e);const t=x.invert(mx);g.style('display',null);
      const rows=series.map(s=>{const d=s.values[bis(s.values,t)];return d?`<div>${esc(s.name)}: <b>${(o.tipfmt||(v=>fmt(v)))(d[1])}</b></div>`:''});
      const d0=series[0].values[bis(series[0].values,t)];g.select('line').attr('x1',x(d0[0])).attr('x2',x(d0[0]));
      showTip(e,`<b>Week ending ${d3.utcFormat('%b %d, %Y')(d0[0])}</b>${rows.join('')}`)})
    .on('mouseleave',()=>{g.style('display','none');hideTip()});
}
function spark(el, vals, color, o={}){
  const W=Math.max(180,el.clientWidth||260),H=54; el.innerHTML='';
  const svg=d3.select(el).append('svg').attr('viewBox',`0 0 ${W} ${H}`).attr('aria-hidden','true');
  const x=d3.scaleLinear().domain([0,vals.length-1]).range([2,W-4]);

/* ---------- widow control ----------
   text-wrap:pretty is not honoured everywhere, so bind the final two words of
   each block of prose with a non-breaking space. That makes it impossible for
   a single word to be left stranded on its own last line. Runs on the text
   node itself so markup, links and entities inside the block are untouched. */
function noWidows(root){
  if(!root) return;
  root.querySelectorAll('p,li,dd,figcaption,.note').forEach(el=>{
    if(el.dataset.nw) return;
    const walk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
    let last=null,n;
    while((n=walk.nextNode())) if(n.nodeValue.trim()) last=n;
    if(!last) return;
    const t=last.nodeValue.replace(/\s+$/,'');
    const words=t.split(' ');
    if(words.length>1 && t.length>40){
      words[words.length-1]='\u00A0'+words[words.length-1];
      last.nodeValue=words.slice(0,-1).join(' ')+words[words.length-1];
    }
    el.dataset.nw='1';
  });
}

/* ---------- assay-target vulnerability ---------- */
function assayPanel(){
  const why=`<p>A validated diagnostic assay binds a specific stretch of the pathogen genome. When that stretch accumulates sequence variation, the assay can quietly lose sensitivity — the pathogen is present, and the test stops reporting it. The reference case is measles genotype B3 in 2024–2025, where a single substitution in the N-gene target rose from under 2% of submitted sequences to the majority and degraded a widely used RT-PCR target.</p>
  <p>This failure mode is invisible in every public wastewater aggregate, CDC's included, because aggregates report <i>detections</i> and never report what the assay could no longer see. A detection rate that falls because an assay drifted looks identical to one that falls because transmission fell.</p>
  <p class="note"><b>What this panel is, and is not.</b> It reproduces published assay target coordinates alongside the public sequence record, each row carrying its own citation and the reference accession its coordinates are expressed against. Rows without a citation, accession or valid coordinate range are dropped rather than displayed. It is a quality-control reference for laboratories deciding whether to re-verify their own panels. It does not design, recommend, optimise or score any assay, and it is not a substitute for a laboratory's own verification.</p>`;

  // Defense in depth: refuse to render any row that looks like a placeholder,
  // even if one reaches the export. A citation is what makes a coordinate
  // trustworthy, so anything self-describing as demo, example, test, dummy,
  // illustrative or TBD is dropped here rather than shown to a reader.
  const PLACEHOLDER=/\b(demo|demonstration|example|sample|placeholder|dummy|test|illustrative|fake|synthetic|simulated|tbd|todo|lorem|xxx|n\/?a)\b/i;
  const all=D.assay_targets||[];
  const a=all.filter(r=>{
    const c=String(r.citation||'').trim();
    return c && !PLACEHOLDER.test(c) && !PLACEHOLDER.test(String(r.assay_name||''));
  });
  const dropped=all.length-a.length;
  if(!a.length)
    return `<article class="panel c12"><header><h2>Assay-target vulnerability</h2><span class="small muted">why the structural layer is here</span></header>
      ${why}
      ${notLoaded('Assay-target panel','a curated table of published primer and probe coordinates, each row carrying its own citation and reference accession',
        (dropped?`<b>${dropped} row${dropped===1?'':'s'} in this run named no real citation and ${dropped===1?'was':'were'} refused.</b> `:'')+
        'This table is a <b>curated input</b>, not a computed one. Primer and probe coordinates are published in specific papers and protocol documents; inferring or generating them would be worse than showing none. Entries appear only once a citation-bearing panel is supplied and verified.')}</article>`;
  const ov=a[0]&&a[0].overlay_note;
  return `<article class="panel c12"><header><h2>Assay-target vulnerability</h2><span class="small muted">published target regions, with citations</span></header>
  ${why}
  <div class="tbl"><table><tr><th>Pathogen</th><th>Assay</th><th>Gene</th><th>Reference accession</th><th class="n">Region</th><th class="n">Length</th><th>Citation</th></tr>
    ${a.map(r=>`<tr><td>${esc(r.pathogen)}</td><td>${esc(r.assay_name)}</td><td>${esc(r.target_gene)}</td>
      <td class="mono small">${esc(r.reference_accession)}</td>
      <td class="n mono">${r.region_start}–${r.region_end}</td><td class="n">${r.region_length??'—'} nt</td>
      <td class="small">${r.citation_url?`<a href="${esc(r.citation_url)}" target="_blank" rel="noopener">${esc(r.citation)}</a>`:esc(r.citation)}</td></tr>`).join('')}</table></div>
  ${ov&&!PLACEHOLDER.test(ov)?`<p class="note">${esc(ov)}</p>`:''}</article>`;
}

/* ---------- forecast scoreboard ---------- */
function forecastPanel(){
  const defn=`<p class="note"><b>How this works, and what it is for.</b> Each weekly run writes its forecasts to a ledger keyed by run identifier <i>before</i> the outcome exists, and a later run scores them against what was actually observed. A prediction already on the ledger for a given run is never rewritten, so the scoreboard cannot be retrofitted after the fact.</p>
  <p class="note"><b>The models here are deliberately plain</b> — a persistence baseline and a linear extrapolation of the trailing four weeks. The contribution is not the model but the ledger: the field has no public wastewater forecasting hub or standing benchmark, so there is nowhere to find out whether anyone's forecast actually worked. A stronger model can be added later and scored on the same ledger against the same frozen history. Negative skill is reported as readily as positive skill; a trend term that makes forecasts worse is a result, not a bug.</p>`;
  if(!D.forecast_board||!D.forecast_board.length)
    return `<article class="panel c12"><header><h2>Forecast scoreboard</h2></header>
      <p><b>This is not a failed load.</b> The ledger is being written correctly, but nothing has matured yet: a forecast made this week cannot be scored until the week it predicted has actually arrived. The first scores appear once the shortest horizon comes due. No placeholder scores are shown in the meantime.</p>${defn}</article>`;
  const b=D.forecast_board;
  const best=b.reduce((a,c)=>(c.skill_vs_persistence??-9)>(a.skill_vs_persistence??-9)?c:a,b[0]);
  const nScored=d3.sum(b,r=>r.n_scored||0);
  return `<article class="panel c12"><header><h2>Forecast scoreboard <button class="qmark" data-gloss="forecast-skill" aria-label="What does forecast skill mean?">?</button></h2><span class="small muted">frozen predictions, scored on arrival</span></header>
  <div class="statgrid">
    <div class="stat"><span class="label">Forecasts scored</span><span class="big">${nScored.toLocaleString()}</span></div>
    <div class="stat"><span class="label">Best skill vs persistence</span><span class="big" style="color:${(best.skill_vs_persistence??0)>0?'var(--accent)':'var(--hi)'}">${fmt(best.skill_vs_persistence,3)}</span><span class="small muted">${esc(best.pathogen)}, ${best.horizon_weeks} wk</span></div>
    <div class="stat"><span class="label">Horizons tracked</span><span class="big">${[...new Set(b.map(r=>r.horizon_weeks))].join(', ')}</span><span class="small muted">weeks ahead</span></div>
  </div>
  <div class="tbl"><table><tr><th>Pathogen</th><th class="n">Horizon</th><th class="n">Scored</th><th class="n">MAE persistence</th><th class="n">MAE linear</th><th class="n">Bias linear</th><th class="n">Skill</th></tr>
    ${b.map(r=>`<tr><td>${esc(r.pathogen)}</td><td class="n">${r.horizon_weeks} wk</td><td class="n">${r.n_scored}</td>
      <td class="n">${fmt(r.mae_persistence,3)}</td><td class="n">${fmt(r.mae_linear,3)}</td>
      <td class="n">${r.bias_linear>0?'+':''}${fmt(r.bias_linear,3)}</td>
      <td class="n" style="color:${(r.skill_vs_persistence??0)>0?'var(--accent)':'var(--hi)'}"><b>${fmt(r.skill_vs_persistence,3)}</b></td></tr>`).join('')}</table></div>
  <p class="small muted">Skill is 1 − (MAE of the linear model ÷ MAE of persistence). Above zero the trend term helped; below zero it hurt. Units are site-standardized z, so errors are comparable across pathogens.</p>
  ${defn}</article>`;
}

  <p class="note"><b>Stated limitation.</b> The vulnerability term is a county-level proxy. A true within-sewershed demographic comparison needs block-group service-area boundaries, and CDC NWSS does not publish them. That is a limit of the available data, not of the definition, and it is reported rather than worked around.</p>`;

function attritionPanel(){
  const defn=`<p class="note"><b>Definition.</b> A site is <b>dormant</b> when its most recent sample is more than ${D.attrition_sites&&D.attrition_sites.length?esc(D.attrition_sites[0].dormant_threshold_weeks):'8'} weeks before the latest sample week anywhere in the run. That is a statement about reporting, not about the facility: a dormant site may still be operating and simply not reporting to CDC NWSS.</p>
  <p class="note">This measure exists only because every weekly run is frozen and versioned. A platform that overwrites its own values cannot reconstruct when a site stopped reporting, which is why coverage attrition has no published equivalent.</p>`;
  if(!D.attrition_sites||!D.attrition_sites.length)
    return `<article class="panel c12"><header><h2>Coverage attrition</h2></header>
      ${notLoaded('Coverage attrition','CDC NWSS site-level sample records across the full study window','Attrition is derived from each site&rsquo;s first and last reporting week, so it needs the complete harmonised record set for the run.')}${defn}</article>`;
  const s=D.attrition_sites, y=D.attrition_yearly||[], v=D.attrition_vuln||[];
  const dormant=s.filter(x=>x.status==='dormant');
  const popLost=d3.sum(dormant,x=>x.population_served||0);
  return `<article class="panel c12"><header><h2>Coverage attrition <button class="qmark" data-gloss="attrition" aria-label="What does coverage attrition mean?">?</button></h2><span class="small muted">which sites went dark, when, and where</span></header>
  <div class="statgrid">
    <div class="stat"><span class="label">Sites ever reporting</span><span class="big">${s.length.toLocaleString()}</span></div>
    <div class="stat"><span class="label">Dormant now</span><span class="big" style="color:var(--hi)">${dormant.length.toLocaleString()}</span><span class="small muted">${fmt(100*dormant.length/s.length,0)}% of all sites</span></div>
    <div class="stat"><span class="label">Population no longer observed</span><span class="big">${popLost?Math.round(popLost).toLocaleString():'—'}</span><span class="small muted">served by dormant sites</span></div>
  </div>
  <div class="grid">
  ${y.length?`<article class="panel c6"><header><h3>Sites reporting by year</h3></header><div class="chart" id="a-bars"></div>
    <div class="tbl"><table><tr><th>Year</th><th class="n">Reporting</th><th class="n">Started</th><th class="n">Stopped</th><th class="n">Population lost</th></tr>
      ${y.map(r=>`<tr><td>${r.year}</td><td class="n">${r.sites_reporting}</td><td class="n">${r.sites_started}</td><td class="n" style="color:${r.sites_stopped?'var(--hi)':'inherit'}">${r.sites_stopped}</td><td class="n">${r.population_lost?Math.round(r.population_lost).toLocaleString():'—'}</td></tr>`).join('')}</table></div></article>`:''}
  ${v.length?`<article class="panel c6"><header><h3>Dormancy by social vulnerability <button class="qmark" data-gloss="dormant-site" aria-label="Define dormant site">?</button></h3></header><div class="chart" id="av-bars"></div>
    <div class="tbl"><table><tr><th>SVI quartile</th><th class="n">Sites</th><th class="n">Dormant</th><th class="n">% dormant</th></tr>
      ${v.map(q=>`<tr><td>${esc(q.svi_quartile)}</td><td class="n">${q.sites}</td><td class="n">${q.dormant}</td><td class="n"><b>${fmt(q.pct_dormant,1)}%</b></td></tr>`).join('')}</table></div>
    <p class="note">Descriptive comparison only. A site going dormant and a county's vulnerability score are both observed; nothing here identifies why any particular site stopped reporting.</p></article>`:''}
  </div>
  ${defn}</article>`;
}

map(){

    <p class="note">Positive lead = wastewater peaked first. At state level, ${D.state_seasons.flagged} of ${D.state_seasons.n} eligible state-seasons are flagged for implausible leads (${D.state_seasons.by.map(b=>`${b.pathogen} ${b.flagged}`).join(', ')}).</p></article>

leadtime(){
  const el=document.getElementById('v-leadtime');
  const head=`<div class="head"><h1>Lead time, decomposed <button class="qmark" data-gloss="operational-lead" aria-label="What does operational lead mean?">?</button></h1>
    <p class="muted">Early warning is usually reported as one number. It is actually three, and only the third one tells a health department whether the signal arrived in time to act on.</p></div>
  <article class="panel c12 plain">
    <p>People shed viruses into wastewater before they feel sick enough to go to a hospital. That is the promise of this method: sewage can show an outbreak building before clinics do. The usual way of saying this is “wastewater gives one to three weeks of warning.”</p>
    <p>But that sentence quietly skips a step. The virus reaching the sewer is not the same as <i>somebody knowing about it</i>. The sample has to be collected, shipped, tested, reported to the state, passed to CDC and published. All of that takes time too — and that time comes out of the warning, not in addition to it.</p>
    <p>So this page measures three things instead of one:</p>
    <ul class="plainlist">
      <li><b>Shedding lead</b> <button class="qmark" data-gloss="shedding-lead" aria-label="Define shedding lead">?</button> — how far ahead the sewage signal actually is. Pure biology.</li>
      <li><b>Reporting lag</b> <button class="qmark" data-gloss="reporting-lag" aria-label="Define reporting lag">?</button> — how long it takes that signal to become public. Pure logistics.</li>
      <li><b>Operational lead</b> <button class="qmark" data-gloss="operational-lead" aria-label="Define operational lead">?</button> — what is left over. This is the real warning time.</li>
    </ul>
    <p>If a virus shows up in sewage two weeks early, but it takes two weeks to publish the result, the <b>real warning time is zero</b>. The signal was there. Nobody could have used it. That is not a failure of wastewater surveillance — it is a failure of the pipeline around it, and it is fixable in a way that biology is not.</p>
    <p><b>Why this matters:</b> a health department deciding whether to fund a wastewater program needs the third number, not the first. Reporting a two-week lead when the usable lead is zero promises something the system cannot deliver.</p></article>`;
  const explain=`<article class="panel c12"><header><h2>What the three terms mean</h2></header>
    <div class="tbl"><table class="stack"><tr><th>Term</th><th>Definition</th><th>What it is measured from</th></tr>
      <tr><td class="lead" data-l="Term"><b>Shedding lead</b></td><td data-l="Definition" class="small">Weeks that wastewater activity leads emergency-department visits.</td><td data-l="Measured from" class="small">Cross-correlation best lag between the site-standardized wastewater index and NSSP ED visit percentage, per pathogen and state.</td></tr>
      <tr><td class="lead" data-l="Term"><b>Reporting lag</b></td><td data-l="Definition" class="small">Weeks between a sample being collected and its value appearing in the public CDC dataset.</td><td data-l="Measured from" class="small">The CDC dataset's own <span class="mono">rowsUpdatedAt</span> metadata minus the latest sample week present in that dataset.</td></tr>
      <tr><td class="lead" data-l="Term"><b>Operational lead</b></td><td data-l="Definition" class="small">Shedding lead minus reporting lag. Can be zero or negative.</td><td data-l="Measured from" class="small">Difference of the two rows above. Nothing is modeled; all three are differences between observed dates.</td></tr>
    </table></div>
    <p class="note">Published lead-time figures are almost always shedding lead alone, which overstates usable warning time because it ignores the pipeline between the laboratory and the public dataset. A negative operational lead does not mean wastewater carries no signal — it means that in this run, for this pathogen and state, the signal became public after the clinical rise it was meant to anticipate.</p></article>`;

  if(!D.leadtime||!D.leadtime.length){
    el.innerHTML=head+explain+`<article class="panel c12"><header><h2>Lead-time decomposition</h2></header>
      ${notLoaded('Lead-time decomposition','CDC NWSS wastewater datasets and CDC NSSP emergency-department data, combined with each dataset&rsquo;s own update metadata','Both inputs must be present in the same run: the cross-correlation needs paired wastewater and clinical weeks, and the reporting lag needs the dataset update timestamp.')}</article>`;
    return;
  }

  const sup=D.leadtime.filter(r=>r.lead_supported);
  const nat=(D.leadtime_national||[]);
  const usable=sup.filter(r=>r.usable).length;
  el.innerHTML=head+`
  <div class="statgrid">
    <div class="stat"><span class="label">State–pathogen pairs with a supported lead</span><span class="big">${sup.length}</span><span class="small muted">of ${D.leadtime.length} tested</span></div>
    <div class="stat"><span class="label">Of those, usable operational lead</span><span class="big" style="color:${usable?'var(--accent)':'var(--hi)'}">${usable}</span><span class="small muted">operational lead above zero</span></div>
    <div class="stat"><span class="label">Median reporting lag</span><span class="big">${fmt(d3.median(D.leadtime,r=>r.reporting_lag_weeks),1)}</span><span class="small muted">weeks, sample to publication</span></div>
  </div>
  ${nat.length?`<article class="panel c12"><header><h2>By pathogen</h2><span class="small muted">median across states with a supported lead</span></header>
    <div class="chart" id="lt-bars"></div>
    ${legend([['#1d4f91','Shedding lead'],['#6e1f2b','Reporting lag'],['#c49a4a','Operational lead']])}
    <div class="tbl"><table><tr><th>Pathogen</th><th class="n">States</th><th class="n">Shedding lead</th><th class="n">Reporting lag</th><th class="n">Operational lead</th><th class="n">% usable</th></tr>
      ${nat.map(n=>`<tr><td>${esc(n.pathogen)}</td><td class="n">${n.n_states_supported}</td>
        <td class="n">${fmt(n.shedding_lead_median,1)} <span class="small muted">(${fmt(n.shedding_lead_p25,1)}–${fmt(n.shedding_lead_p75,1)})</span></td>

    <p class="note">All figures in weeks. Ranges are the 25th–75th percentile across states. A lead counts as supported only when the Spearman association survives Benjamini–Hochberg correction at 0.05 and is positive.</p></article>`:''}

        <td class="n"${r.lead_supported?` style="color:${r.operational_lead_weeks>0?'var(--accent)':'var(--hi)'}"`:''}>${r.lead_supported?`<b>${fmt(r.operational_lead_weeks,1)}</b>`:'—'}</td>
        <td class="small">${esc(r.interpretation)}</td></tr>`).join('')}</table></div>
    <p class="small muted">Where no lead is statistically supported, the shedding and operational columns are left blank rather than filled with a number the data does not support. The reporting lag is a property of the dataset and is shown regardless.</p></article>`
  +explain;

  if(nat.length){
    groupedBars(document.getElementById('lt-bars'),
      nat.map(n=>({name:n.pathogen,shed:n.shedding_lead_median,rep:n.reporting_lag_weeks,op:n.operational_lead_median})),

      {labels:['Shedding lead (wk)','Reporting lag (wk)','Operational lead (wk)'],valueLabels:true,h:260});
  }
},

predictive(){
  const el=document.getElementById('v-predictive');
  const M=Object.fromEntries(D.models.map(m=>[m.pathogen,m]));
  const interp=m=>{const w=m.wastewater_only_r2,g=m.gain_over_persistence;
    const solo=w<=0?`On its own, wastewater did not predict ED visits in the test period (R² ${fmt(w,2)}).`
      :`On its own, wastewater explains about ${Math.round(w*100)}% of the week-to-week variation in ED visits (R² ${fmt(w,2)}).`;
    const add=g>=0.02?`Added to recent ED data, it raises R² by ${fmt(g,3)}.`
      :w>0?`Most of that signal overlaps with last week’s ED value, so adding it to the model changes R² by only ${g>0?'+':''}${fmt(g,3)}.`
      :`Adding it to the model changes R² by only ${g>0?'+':''}${fmt(g,3)}.`;
    return solo+' '+add};
  el.innerHTML=`<div class="head"><h1>Predictive models</h1><p class="muted">Does wastewater help predict emergency-department burden? Each model was trained on earlier weeks and tested on a later held-out period.</p></div>
  <article class="panel"><header><h2>Held-out accuracy (R²)</h2></header><div class="chart" id="p-bars"></div>
  ${legend([['var(--muted)','Clinical history only (persistence)'],['var(--el)','Wastewater only'],['var(--accent)','Full multimodal model']])}</article>
  <div class="grid">${ROUTINE.map(p=>{const m=M[p];return `<article class="panel c4"><header><h2>${p}</h2><span class="small mono">${m.best_model}</span></header>
    <p style="font-weight:600">${esc(m.plain_language)}</p>
    <div class="kv small"><div><span class="label">Full R²</span><b>${fmt(m.full_model_r2,3)}</b></div><div><span class="label">Clinical only</span><b>${fmt(m.clinical_persistence_r2,3)}</b></div><div><span class="label">Gain</span><b>${m.gain_over_persistence>0?'+':''}${fmt(m.gain_over_persistence,3)}</b></div></div>
    <p class="small muted">${interp(m)}</p>
    <span class="label">Top predictors (mean |SHAP|)</span><div class="chart" id="p-shap-${p.replace(/\W/g,'')}"></div></article>`}).join('')}</div>
  <p class="note">Wastewater features (orange) are often strongly correlated with last week’s clinical value (r up to 0.77), so a small SHAP rank inside the full model can understate wastewater’s standalone signal. That is why the wastewater-only model is shown separately.</p>
  ${forecastPanel()}
  <p class="note srcline"><b>Sources.</b> Features from CDC NWSS wastewater and CDC NSSP emergency-department data for the same state-weeks. Models are evaluated on later weeks they never saw. Attribution uses SHAP (Lundberg &amp; Lee, 2017). Full dataset list on <a href="#methods" data-go="methods">Methods &amp; sources</a>.</p>`;
  groupedBars(document.getElementById('p-bars'),ROUTINE.map(p=>({name:p,a:M[p].clinical_persistence_r2,b:M[p].wastewater_only_r2,c:M[p].full_model_r2})),['a','b','c'],[css('--muted'),css('--el'),css('--accent')],{labels:['Clinical only','Wastewater only','Full model'],valueLabels:true,max:1,w:1000,h:300});
  ROUTINE.forEach(p=>hbars(document.getElementById('p-shap-'+p.replace(/\W/g,'')),D.shap.filter(s=>s.pathogen===p).slice(0,8).map(s=>({label:FEAT(s.feature),v:s.mean_abs_shap,color:/^(ww_|wastewater)/.test(s.feature)?css('--el'):css('--muted')})),{left:150,w:360,bh:18,fmt:v=>v<.01?v.toFixed(3):v.toFixed(2)}));
},

  el.innerHTML=`<div class="head"><h1>Coverage & equity</h1><p class="muted">Who the wastewater system reaches, measured against the CDC/ATSDR Social Vulnerability Index (SVI).</p></div>

  <article class="panel c12"><header><h2>Model result</h2><span class="small muted">binomial GLM, ${g.glm_n_counties.toLocaleString()} counties with surveillance</span></header>

    <p class="note"><b>This model is a replication, and is presented as one.</b> Alkhouri et al. (<i>AJPM Focus</i>, 2025) fitted the same county-level design on 859 of 3,143 counties and reported coverage skewed by county demographics. The contribution here is not the finding but the frame: the model is refitted on every county in the weekly run, the inputs are published as analysis-ready tables, and the result is recomputed and re-versioned each week rather than fixed at one point in time. The two measures below — representativeness and attrition — are the parts of this page with no published equivalent.</p></article></div>
  ${repPanel()}
  ${attritionPanel()}`;

        const s=v[0]??0;return s>=.75?'#14213a':s>=.5?'#1d4f91':s>=.25?'#c49a4a':'#f0cf8f'},
      f=>{const v=D.rep_by_fips[f];return `<b>${cname(f)}</b>${v&&v[2]?`<div>Representativeness ${fmt(v[0])}</div><div>Sewer share ${v[1]!=null?fmt(100*v[1],0)+'%':'—'}</div><div>${v[2]} site${v[2]===1?'':'s'}</div>`:'<div>No monitored sewershed</div>'}`},
      {label:'County representativeness map'});

global(){
  const el=document.getElementById('v-global');
  const head=`<div class="head"><h1>Global coverage <button class="qmark" data-gloss="global-coverage" aria-label="What does global coverage mean?">?</button></h1>
    <p class="muted">Wastewater surveillance can only ever see people whose waste reaches a monitored sewer. This page asks a different question from the rest of the site: not “what is rising,” but “who could this method ever detect in the first place?”</p></div>
  <article class="panel c12 plain">
    <p>Testing sewage for disease works by catching what a community flushes. If a household is not connected to a sewer system — if it uses a pit latrine, a septic tank, or no sanitation at all — nothing that household sheds ever arrives at a treatment plant, so no amount of testing will ever detect it.</p>
    <p>That makes sewer connection a hard ceiling on this method. Worldwide, <b>most people are not connected to a sewer.</b> So before asking whether a country has a wastewater surveillance program, this page asks how much of that country's population such a program could observe even if it were perfectly run and fully funded.</p>
    <p><b>Why it matters for policy:</b> the countries with the least sewer connection are generally the countries with the least surveillance capacity. The populations this method can least observe are the same populations least likely to have a program trying to observe them. Investment in wastewater surveillance alone will not close that gap, because the gap is in sanitation infrastructure, not in laboratories.</p>
    <p><b>Why it matters for researchers:</b> a national wastewater figure is a statement about the sewered population, not the whole population. Comparing two countries' numbers without comparing their sewer coverage compares two different denominators.</p></article>`;
  const sources=`<article class="panel c12"><header><h2>Why this layer is built this way</h2></header>
    <p>Absolute wastewater concentrations are not portable between countries: normalization targets, units and laboratory methods diverge, so a figure from one national program cannot be placed on the same axis as another's. Only <b>within-site relative</b> metrics transfer, which is the standardization this project already uses throughout.</p>
    <p>Of the national programs publishing wastewater data, only two currently publish it in a genuinely machine-readable, openly licensed form: <b>Germany</b>'s AMELAG (Robert Koch-Institut, CC BY 4.0, versioned with a DOI) and the <b>Netherlands</b>' RIVM open data. Sequences and phylogenetics in this project come from <b>NCBI Virus, GenBank and the SRA</b> — public-domain INSDC records that may be redistributed, which is why every sequence shown here can be downloaded, checked and reused by anyone.</p>
    <p><b>Sources for this page.</b> Sewer-connected share and population: <a href="https://washdata.org/data/downloads" target="_blank" rel="noopener">WHO/UNICEF Joint Monitoring Program</a> household world workbook, downloaded and parsed each run, with the raw workbook frozen alongside the run. Income classification: <a href="https://api.worldbank.org/v2/country?format=json" target="_blank" rel="noopener">World Bank country API</a>, fetched each run rather than hard-coded, because those classifications are revised annually. German site-level data: <a href="https://github.com/robert-koch-institut/Abwassersurveillance_AMELAG" target="_blank" rel="noopener">RKI AMELAG</a>. The “Status in this run” column states, per country, whether a feed was actually ingested or is only a known feed not yet wired in — a registry entry is not data in hand.</p>
    </article>`;

  if(!D.global_coverage||!D.global_coverage.length){
    el.innerHTML=head+`<article class="panel c12"><header><h2>Global coverage</h2></header>
      ${notLoaded('The sanitation denominator','WHO/UNICEF Joint Monitoring Programme household world workbook (<a href="https://washdata.org/data/downloads" target="_blank" rel="noopener">washdata.org</a>), downloaded and parsed on each run','Either the download failed or the workbook&rsquo;s sheet and column layout changed from what the parser recognizes; the Audit log records which. If a frozen JMP extract is present in the repository it is used as a fallback. The German AMELAG and World Bank fetches are attempted every run and reported there too.')}</article>`+sources;
    return;
  }

  const g=D.global_coverage, inc=D.global_income||[];
  const withSM=g.filter(c=>c.safely_managed_pct!=null&&c.sanitation_not_observable_pct!=null);
  const hasSM=withSM.length>0, smN=withSM.length;
  const smPop=d3.sum(withSM,c=>c.sanitation_not_observable_population||0);
  const topGap=withSM.slice().sort((a,b)=>b.sanitation_not_observable_pct-a.sanitation_not_observable_pct).slice(0,3);
  const feeds=g.filter(c=>c.has_open_feed);
  const totPop=d3.sum(g,c=>c.population||0), obs=d3.sum(g,c=>c.observable_population||0);
  el.innerHTML=head+`
  <div class="statgrid">
    <div class="stat"><span class="label">Countries with sanitation data</span><span class="big">${g.length}</span></div>
    <div class="stat"><span class="label">With an open machine-readable feed</span><span class="big">${feeds.length}</span><span class="small muted">${feeds.map(c=>esc(c.country)).join(', ')||'none'}</span></div>
    <div class="stat"><span class="label">Population observable by this method</span><span class="big">${totPop?fmt(100*obs/totPop,0)+'%':'—'}</span><span class="small muted">sewer-connected share, weighted</span></div>
  </div>
  ${inc.length?`<article class="panel c6"><header><h2>Observable population by income group <button class="qmark" data-gloss="observable-population" aria-label="What does observable population mean?">?</button></h2></header>
    <div class="chart" id="gl-bars"></div>
    <div class="tbl"><table><tr><th>Income group</th><th class="n">Countries</th><th class="n">Open feed</th><th class="n">Median sewer %</th><th class="n">Observable</th></tr>
      ${inc.map(i=>`<tr><td>${esc(i.income_group)}</td><td class="n">${i.countries}</td><td class="n">${i.countries_with_open_feed}</td><td class="n">${fmt(i.median_sewer_connected_pct,0)}%</td><td class="n">${fmt(i.pct_population_observable,0)}%</td></tr>`).join('')}</table></div>
    <p class="note">The gradient is the finding: where sewer connection is lowest, surveillance capacity is lowest too, so the populations least observable by this method are also the least likely to be covered by a program that could observe them.</p></article>`:''}
  ${hasSM?`<article class="panel c12"><header><h2>Sanitation is not the same as visibility</h2></header>
    <p>“Safely managed sanitation” (World Bank <span class="mono">SH.STA.SMSS.ZS</span>) counts septic tanks and improved latrines as success — and rightly so, as public health. But neither reaches a treatment plant, so neither can be observed by testing wastewater. The difference between the two columns below is, approximately, <b>the population with working sanitation that this method still cannot see.</b></p>
    <div class="statgrid">
      <div class="stat"><span class="label">Population with sanitation but not sewered</span><span class="big">${smPop?Math.round(smPop).toLocaleString():'—'}</span><span class="small muted">across ${smN} countries reporting both</span></div>
      <div class="stat"><span class="label">Median gap</span><span class="big">${fmt(d3.median(withSM,c=>c.sanitation_not_observable_pct),1)}%</span><span class="small muted">safely managed minus sewer-connected</span></div>
      <div class="stat"><span class="label">Largest gaps</span><span class="big" style="font-size:1.2rem">${topGap.map(c=>esc(c.country)).join(', ')||'—'}</span></div>
    </div>
    <p class="note">The two series come from different collections and can cross in either direction for a given country-year. Where safely managed is reported below sewer-connected the gap is not interpretable and is shown as zero rather than a negative number.</p></article>`:''}
  <article class="panel c6"><header><h2>Sewer-connected population by country <button class="qmark" data-gloss="sewer-connected" aria-label="What does sewer-connected mean?">?</button></h2><span class="small muted">lowest first</span></header>
    <div class="tbl scroll"><table><tr><th>Country</th><th class="n">Sewer %</th>${hasSM?'<th class="n">Safely managed %</th><th class="n">Gap</th>':''}<th>Income group</th><th>Open feed</th><th>Status in this run</th></tr>
      ${g.slice(0,60).map(c=>`<tr><td>${esc(c.country)}</td><td class="n">${fmt(c.sewer_connected_pct,1)}</td>${hasSM?`<td class="n">${c.safely_managed_pct!=null?fmt(c.safely_managed_pct,1):'—'}</td><td class="n">${c.sanitation_not_observable_pct!=null?fmt(c.sanitation_not_observable_pct,1):'—'}</td>`:''}<td class="small">${esc(c.income_group??'—')}</td><td class="small">${c.open_machine_readable_feed?esc(c.open_machine_readable_feed):'—'}</td><td class="small muted">${esc(c.feed_status??'—')}</td></tr>`).join('')}</table></div>
    ${g.length>60?`<p class="small muted">Showing the 60 countries with the lowest sewer-connected share, of ${g.length}.</p>`:''}</article>`
  +sources;

  if(inc.length){
    hbars(document.getElementById('gl-bars'),
      inc.map(i=>({label:i.income_group,v:i.pct_population_observable??0})),
      {min:0,max:100,left:140,bh:34,fmt:v=>fmt(v,0)+'%'});
  }
},

  ${obs.map(c=>`<tr><td class="lead">${esc(c.county_name)}</td><td class="n" data-l="Weeks">${c.surveillance_weeks}</td><td class="mono" data-l="Last season">${c.last_season_with_data??'—'}</td><td data-l="Status"><span style="display:inline-flex;gap:6px;align-items:baseline"><span class="chip sw" style="background:${css(ST[c.status])};flex:none"></span><span>${c.status}</span></span></td></tr>`).join('')}</table></div></article></div>

    <div class="chart" id="t-rho"></div></article>
  <article class="panel c12"><header><h2>Seasonal peaks</h2><span class="small muted">seasons meeting coverage criteria</span></header>

    ${D.tn_seasonal.some(s=>s.eligible_for_tennessee_seasonal_inference&&s.implausible_lead_flag)?'<p class="callout">⚑ Flagged leads are not real lags. SARS-CoV-2 has summer and winter waves, and in these seasons the wastewater and clinical peaks fell in different waves.</p>':''}</article></div>
