<style>
/* Layout: lab console — fixed left rail of views, a run-status strip across the top, data panels in a 12-col grid */
:root{
  /* NWGS Grid™ brand (Victoria Love Franklin signature palette): navy, wine, gold on paper */
  --navy:#14213a; --navy-2:#1c2c4c; --wine:#6e1f2b; --gold:#c49a4a; --gold-soft:#f0cf8f; --paper:#fbf8f3; --cream:#f7f1e8;
  --bg:#f7f3ec; --surface:#ffffff; --ink:#14213a; --muted:#5b6070; --line:#e2dccf;
  --accent:#1c2c4c; --accent-ink:#ffffff; --accent-soft:#e7ebf3; --link:#1c2c4c;
  --rail-bg:#14213a; --rail-ink:#f7f1e8; --rail-muted:#b8bfcc; --rail-hover:rgba(247,241,232,.08); --rail-active:rgba(196,154,74,.2);
  --nodata:#e6e1d8; --typ:#f3f0ea; --typ-line:#bdb5a6; --hi-soft:#f5cdc6;
  --vl:#2166ac; --lo:#67a9cf; --el:#ef8a62; --hi:#b2182b; --warn:#b4630f; --ok:#2e7d4f;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1424; --surface:#131d33; --ink:#f2ece2; --muted:#a9b0c0; --line:#27324b;
  --accent:#e0bd74; --accent-ink:#14213a; --accent-soft:#25304a; --link:#f0cf8f;
  --rail-bg:#09101f; --rail-ink:#f2ece2; --rail-muted:#9aa3b5; --rail-hover:rgba(242,236,226,.07); --rail-active:rgba(224,189,116,.18);
  --nodata:#283247; --typ:#8e95a3; --typ-line:#8e95a3; --hi-soft:#4d2630;
  --vl:#4f8fd0; --lo:#8cc3e0; --el:#f09a76; --hi:#e2525a; --warn:#e3a14e; --ok:#5fbf86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1424; --surface:#131d33; --ink:#f2ece2; --muted:#a9b0c0; --line:#27324b;
  --accent:#e0bd74; --accent-ink:#14213a; --accent-soft:#25304a; --link:#f0cf8f;
  --rail-bg:#09101f; --rail-ink:#f2ece2; --rail-muted:#9aa3b5; --rail-hover:rgba(242,236,226,.07); --rail-active:rgba(224,189,116,.18);
  --nodata:#283247; --typ:#8e95a3; --typ-line:#8e95a3; --hi-soft:#4d2630;
  --vl:#4f8fd0; --lo:#8cc3e0; --el:#f09a76; --hi:#e2525a; --warn:#e3a14e; --ok:#5fbf86; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration-color:color-mix(in srgb,var(--gold) 70%,transparent);text-underline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.005em;text-wrap:balance;margin:0;font-optical-sizing:auto}
h1{font-size:2rem;line-height:1.12}
h2{font-size:1.25rem}
h3{font-size:1rem;font-weight:600;font-family:var(--body)}
p{margin:0;text-wrap:pretty}
li{text-wrap:pretty}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font:600 .7rem/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--rail-bg);color:var(--rail-ink);padding:22px 14px;display:flex;flex-direction:column;gap:20px;border-top:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none;color:inherit}
.brand svg{flex:none}
.brand .wm{display:flex;flex-direction:column;gap:3px}
.brand b{font:700 1.4rem/1 var(--display);letter-spacing:.005em;color:var(--rail-ink)}
.brand b span{color:var(--gold)}
.brand b sup{font:500 .55rem var(--body);color:var(--rail-muted);margin-left:1px}
.brand small{color:var(--rail-muted);font-size:.72rem;line-height:1.3}
.menubtn{display:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px 8px 12px;border-radius:6px;font-size:.9rem;color:var(--rail-muted);display:flex;justify-content:space-between;align-items:center;border-left:3px solid transparent}
.nav button:hover{color:var(--rail-ink);background:var(--rail-hover)}
.nav button[aria-current="page"]{background:var(--rail-active);color:var(--rail-ink);font-weight:600;border-left-color:var(--gold)}
.nav button:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.nav .count{font:500 .72rem var(--mono);color:var(--gold-soft);background:rgba(196,154,74,.16);padding:1px 7px;border-radius:999px}
.rail .foot{margin-top:auto;font-size:.72rem;color:var(--rail-muted);padding:0 8px;line-height:1.5}
.sitefoot{margin-top:12px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.78rem;color:var(--muted)}
.acct{margin-left:auto}
.acct button{all:unset;cursor:pointer;font-size:.82rem;color:var(--accent);font-weight:600}
.acct button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.form{display:grid;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.form input,.form select,.form textarea{font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
.form textarea{min-height:90px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.msg{font-size:.84rem;padding:8px 10px;border-radius:var(--r);border:1px solid var(--line)}
.msg.ok{border-color:var(--ok);color:var(--ok)} .msg.err{border-color:var(--hi);color:var(--hi)}
button.btn{cursor:pointer;font-family:inherit}
button.btn[disabled]{opacity:.6;cursor:default}
.btn.small{padding:4px 9px;font-size:.78rem}
details>summary.btn{list-style:none}
details>summary.btn::-webkit-details-marker{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);text-decoration:none;font-size:.86rem;font-weight:500}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:none}
.opt details{align-self:stretch}
.stackcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.sumrow{display:flex;gap:28px}.sumrow div{display:flex;flex-direction:column;gap:4px}
.linkbtn{all:unset;cursor:pointer;color:var(--link);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:2px}
.linkbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.selectwrap select{font:inherit;font-size:.86rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.statecards{display:flex;flex-direction:column;gap:12px}
.statecards .grid{align-items:stretch}
.filterbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.9rem}
.statecard .pblock{display:flex;flex-direction:column;gap:3px}
.statecard .ptitle{font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:7px}
.statecard .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.statecard .btn{align-self:flex-start;margin-top:auto}
.statecard{height:100%}
.banner{margin:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#e9eef6}
.banner img{display:block;width:100%;height:auto;aspect-ratio:1400/349;object-fit:cover;object-position:left center}
.portrait{padding:0;overflow:hidden;margin:0}
.portrait img{display:block;width:100%;height:100%;aspect-ratio:3/4;object-fit:cover;object-position:center 20%}
.role{font-weight:600;color:var(--wine)}
.why .lede{font:500 1.2rem/1.45 var(--display);color:var(--ink)}
.why .sig{font:italic 500 1.05rem var(--display);color:var(--muted)}
.creds{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.creds li::marker{color:var(--gold)}
.refs{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:.86rem}
.refs li{overflow-wrap:anywhere}
.refs li::marker{color:var(--gold);font-weight:600}
.scard .sfig{margin:-18px -20px 4px;border-bottom:1px solid var(--line);background:#fff;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.scard .sfig img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.scard .btn{align-self:flex-start}
.moldlg{width:min(900px,94vw);padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.moldlg::backdrop{background:rgba(12,20,36,.6)}
.molhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.molview{position:relative;width:100%;height:min(70vh,560px)}
.emlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.emlist li{border-top:1px solid var(--line);padding-top:8px}
.cite{font-size:.84rem;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;overflow-wrap:anywhere}

.main{min-width:0;padding-block:20px 48px;padding-inline:28px;display:flex;flex-direction:column;gap:22px}
.status{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.82rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:12px}
.status .opt-s{white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 .74rem var(--body);padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--surface);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pill.warn i{background:var(--warn)} .pill.ok i{background:var(--ok)} .pill.bad i{background:var(--hi)}
.status button.pill{cursor:pointer}

.view{display:flex;flex-direction:column;gap:20px}
.view[hidden]{display:none}
.head{display:flex;flex-direction:column;gap:8px;max-width:68ch}
.head p{text-wrap:balance;font-size:1rem}
.head .eyebrow{font:600 .72rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(20,33,58,.04)}
.panel.flat{background:transparent;border:none;padding:0}
.panel header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

.card-p{display:flex;flex-direction:column;gap:10px}
.card-p .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 .72rem var(--body);letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid transparent}
.chip.sw{width:12px;height:12px;padding:0;border-radius:3px}
.big{font:600 2rem/1 var(--display);font-variant-numeric:lining-nums tabular-nums}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv b{font:500 .95rem var(--mono)}
.trend-up{color:var(--hi)} .trend-flat{color:var(--muted)} .trend-down{color:var(--vl)}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:.84rem;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}

.mapbox{width:100%;aspect-ratio:960/610;max-width:100%}
.mapbox svg{width:100%;height:100%;display:block}
.county{stroke:var(--surface);stroke-width:.25}
.county:hover{stroke:var(--ink);stroke-width:1}
.statebd{fill:none;stroke:var(--surface);stroke-width:.9;pointer-events:none}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--body)}
.chart .axis path,.chart .axis line{stroke:var(--line)}
.chart .gridl line{stroke:var(--line);stroke-opacity:.7}

.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{font:600 .7rem var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.nw{white-space:nowrap}
.tight th{white-space:normal;vertical-align:bottom}
th .nocase{text-transform:none;letter-spacing:0;font-size:.8rem}
@media (max-width:600px){
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr:first-child{display:none}
  table.stack tr{padding:10px 0;border-bottom:1px solid var(--line)}
  table.stack tr:last-child{border-bottom:none}
  table.stack td{border:none;padding:2px 0;max-width:none!important;text-align:left}
  table.stack td[data-l]::before{content:attr(data-l);display:block;font:600 .66rem/1.6 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  table.stack td.lead{font-weight:600}
  table.stack td[data-l]{display:inline-block;width:auto;margin-right:22px;vertical-align:top}
}

.alert{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:none}
.alert .bar{border-radius:2px}
.alert .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:.76rem;color:var(--muted)}
.sev-high{background:var(--hi)} .sev-moderate{background:var(--warn)} .sev-info{background:var(--accent)}
.status-INFO{color:var(--muted)} .status-PASS{color:var(--ok)} .status-WARN{color:var(--warn)} .status-FAIL{color:var(--hi)}

.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.note{font-size:.82rem;color:var(--muted);max-width:80ch}
.callout{border-left:3px solid var(--warn);padding:8px 12px;background:var(--surface);font-size:.86rem;border-radius:0 var(--r) var(--r) 0}
.detail{min-height:62px;font-size:.86rem}
.flag{color:var(--warn);font-weight:600}

#tip{position:fixed;pointer-events:none;z-index:20;background:var(--ink);color:var(--bg);font-size:.78rem;line-height:1.35;padding:7px 9px;border-radius:5px;max-width:240px;opacity:0;transition:opacity .08s}
#tip b{font-weight:600}

@media (max-width:1100px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .main{padding-inline:22px}
  .c8,.c7,.c6,.c5{grid-column:span 12}.c4,.c3{grid-column:span 6}
  .c4.solo{grid-column:span 12}
  .brand b{font-size:1.15rem}
  .aboutgrid .portrait{grid-column:span 4}.aboutgrid .bio{grid-column:span 8}
}
@media (max-width:760px){
  .portrait img{aspect-ratio:4/5;max-height:440px}
  .aboutgrid .portrait,.aboutgrid .bio{grid-column:span 12}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:0;height:auto;max-height:100vh;z-index:30;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-top-width:3px}
  .brand b{font-size:1.2rem}
  .brand small{display:none}
  .menubtn{display:inline-flex;align-items:center;gap:8px;all:unset;cursor:pointer;color:var(--rail-ink);font:600 .86rem var(--body);padding:7px 12px;border:1px solid rgba(247,241,232,.25);border-radius:999px}
  .menubtn{display:inline-flex}
  .menubtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .nav{display:none;flex-basis:100%;padding:6px 0 10px;max-height:calc(100vh - 70px);overflow-y:auto}
  .rail.open .nav{display:flex}
  .nav button{font-size:1rem;padding:11px 12px}
  .rail .foot{display:none}
  .main{padding-inline:16px;padding-top:14px;gap:18px}
  .c8,.c7,.c6,.c5,.c4,.c3{grid-column:span 12}
  h1{font-size:1.6rem}
  .status{font-size:.78rem;gap:6px 12px}
  .status .opt-s{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const TOPO = JSON.parse(document.getElementById('topo').textContent);
const EMAIL = ['victorialovefranklin','gmail.com'].join('@');
const ROUTINE = ['SARS-CoV-2','RSV','Influenza A'];
const EMERGING = ['Influenza A(H5)','Measles','Mpox'];
const LEVELS = ['Very Low','Low','Typical','Elevated','High'];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const LV = {'Very Low':'--vl','Low':'--lo','Typical':'--typ','Elevated':'--el','High':'--hi'};
const level = z => z==null?null : z<=-1?'Very Low': z<=-0.25?'Low': z<=0.25?'Typical': z<=1?'Elevated':'High';
const lvColor = l => l? css(LV[l]) : css('--nodata');
const fmt = (x,d=2) => {if(x==null||isNaN(x))return '—';const s=Number(x).toFixed(d);return /^-0(\.0+)?$/.test(s)?s.slice(1):s};
const pct = (x,d=1) => x==null?'—':(x*100).toFixed(d)+'%';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pFmt = p => p==null||isNaN(p)?'—': p<0.001?'< 0.001': p<0.01?Number(p).toFixed(3):Number(p).toFixed(2);
const isoTxt = s => esc(s).replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g,(m)=>dateFmt(m));
const FEAT = f => {let m;
  if(f==='wastewater_index')return 'Wastewater, this week';
  if((m=f.match(/^ww_lag(\d+)$/)))return `Wastewater, ${m[1]} wk before`;
  if((m=f.match(/^clinical_lag(\d+)$/)))return `ED visits, ${m[1]} wk before`;
  if(f==='n_sites')return 'Number of sites';
  return f.replace(/_/g,' ')};
const dateFmt = s => s? new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
const STATE_FIPS = {'01':'AL','02':'AK','04':'AZ','05':'AR','06':'CA','08':'CO','09':'CT','10':'DE','11':'DC','12':'FL','13':'GA','15':'HI','16':'ID','17':'IL','18':'IN','19':'IA','20':'KS','21':'KY','22':'LA','23':'ME','24':'MD','25':'MA','26':'MI','27':'MN','28':'MS','29':'MO','30':'MT','31':'NE','32':'NV','33':'NH','34':'NJ','35':'NM','36':'NY','37':'NC','38':'ND','39':'OH','40':'OK','41':'OR','42':'PA','44':'RI','45':'SC','46':'SD','47':'TN','48':'TX','49':'UT','50':'VT','51':'VA','53':'WA','54':'WV','55':'WI','56':'WY'};

/* ---------- tooltip ---------- */
const tip = document.getElementById('tip');
function showTip(e,html){tip.innerHTML=html;tip.style.opacity=1;moveTip(e)}
function moveTip(e){const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.opacity=0}

/* ---------- geometry ---------- */
const counties = topojson.feature(TOPO, TOPO.objects.counties).features;
const statesMesh = topojson.mesh(TOPO, TOPO.objects.states, (a,b)=>a!==b);
const statesFeat = topojson.feature(TOPO, TOPO.objects.states).features;
const nationFeat = topojson.feature(TOPO, TOPO.objects.nation);
const path = d3.geoPath();

function countyMap(el, colorOf, tipOf, opts={}){
  el.innerHTML='';
  const feats = opts.filter? counties.filter(opts.filter) : counties;
  let vb='0 0 975 610';
  if(opts.fit){const b=d3.geoPath().bounds({type:'FeatureCollection',features:feats});const p=6;vb=`${b[0][0]-p} ${b[0][1]-p} ${b[1][0]-b[0][0]+2*p} ${b[1][1]-b[0][1]+2*p}`;el.style.aspectRatio=`${b[1][0]-b[0][0]+2*p}/${b[1][1]-b[0][1]+2*p}`}
  const svg=d3.select(el).append('svg').attr('viewBox',vb).attr('role','img').attr('aria-label',opts.label||'County map');
  svg.append('g').selectAll('path').data(feats).join('path').attr('class','county').attr('d',path)
    .attr('fill',d=>colorOf(d.id)).attr('stroke-width',opts.fit?.8:.25)
    .on('mouseenter',(e,d)=>showTip(e,tipOf(d.id))).on('mousemove',moveTip).on('mouseleave',hideTip)
    .on('click',(e,d)=>opts.onClick&&opts.onClick(d.id));
  if(!opts.fit) svg.append('path').attr('class','statebd').attr('d',path(statesMesh));
  return svg;
}
function stateMap(el, colorOf, tipOf){
  el.innerHTML='';
  const svg=d3.select(el).append('svg').attr('viewBox','0 0 975 610').attr('role','img').attr('aria-label','State map');
  svg.append('g').selectAll('path').data(statesFeat).join('path').attr('d',path).attr('stroke',css('--surface')).attr('stroke-width',1)
    .attr('fill',d=>colorOf(STATE_FIPS[d.id])).on('mouseenter',(e,d)=>showTip(e,tipOf(STATE_FIPS[d.id],d.properties.name))).on('mousemove',moveTip).on('mouseleave',hideTip);
}
const cname = f => {const n=D.names[f];return n?`${esc(n[0])}, ${esc(n[1])}`:`County ${f}`};

/* ---------- charts ---------- */
function lineChart(el, series, o={}){
  el.innerHTML='';
  const W=Math.max(300,el.clientWidth||o.w||720),H=Math.min(o.h||220,Math.max(180,W*.58)),m={t:10,r:14,b:24,l:o.left||38};
  const svg=d3.select(el).append('svg').attr('viewBox',`0 0 ${W} ${H}`);
  const all=series.flatMap(s=>s.values);
  const x=d3.scaleUtc().domain(d3.extent(all,d=>d[0])).range([m.l,W-m.r]);
  const ext=d3.extent(all,d=>d[1]); const lo=o.ymin??Math.min(ext[0],-1.2), hi=o.ymax??Math.max(ext[1],1.2);
  const y=d3.scaleLinear().domain([lo,hi]).nice().range([H-m.b,m.t]);
  if(o.bands){const b=[[-99,-1,'--vl'],[-1,-.25,'--lo'],[.25,1,'--el'],[1,99,'--hi']];
    b.forEach(([a,c,col])=>{const y0=y(Math.max(a,y.domain()[0])),y1=y(Math.min(c,y.domain()[1]));if(y0>y1)svg.append('rect').attr('x',m.l).attr('width',W-m.l-m.r).attr('y',y1).attr('height',y0-y1).attr('fill',css(col)).attr('opacity',.09)})}
  svg.append('g').attr('class','gridl').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(o.yticks||5).tickSize(-(W-m.l-m.r)).tickFormat(o.yfmt||d3.format('.1f'))).call(g=>g.select('.domain').remove()).call(g=>g.selectAll('text').attr('x',-6));
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).ticks(Math.max(2,Math.min(o.xticks||6,Math.floor(W/110)))).tickSizeOuter(0));
  if(o.zero) svg.append('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',y(0)).attr('y2',y(0)).attr('stroke',css('--muted')).attr('stroke-dasharray','2 3');
  series.forEach(s=>{
    if(s.area){svg.append('path').datum(s.values).attr('fill',s.color).attr('opacity',.12).attr('d',d3.area().x(d=>x(d[0])).y0(y(Math.max(0,y.domain()[0]))).y1(d=>y(d[1])).curve(d3.curveMonotoneX))}
    svg.append('path').datum(s.values).attr('fill','none').attr('stroke',s.color).attr('stroke-width',s.width||1.8).attr('d',d3.line().x(d=>x(d[0])).y(d=>y(d[1])).curve(d3.curveMonotoneX));
    const last=s.values[s.values.length-1];svg.append('circle').attr('cx',x(last[0])).attr('cy',y(last[1])).attr('r',3.2).attr('fill',s.color);
  });
  // hover
  const bis=d3.bisector(d=>d[0]).center; const g=svg.append('g').style('display','none');
  g.append('line').attr('y1',m.t).attr('y2',H-m.b).attr('stroke',css('--muted')).attr('stroke-dasharray','2 2');
  svg.append('rect').attr('x',m.l).attr('y',m.t).attr('width',W-m.l-m.r).attr('height',H-m.t-m.b).attr('fill','transparent')
    .on('mousemove',e=>{const [mx]=d3.pointer(e);const t=x.invert(mx);g.style('display',null);
      const rows=series.map(s=>{const d=s.values[bis(s.values,t)];return d?`<div>${esc(s.name)}: <b>${(o.tipfmt||(v=>fmt(v)))(d[1])}</b></div>`:''});
      const d0=series[0].values[bis(series[0].values,t)];g.select('line').attr('x1',x(d0[0])).attr('x2',x(d0[0]));
      showTip(e,`<b>Week ending ${d3.utcFormat('%b %d, %Y')(d0[0])}</b>${rows.join('')}`)})
    .on('mouseleave',()=>{g.style('display','none');hideTip()});
}
function spark(el, vals, color, o={}){
  const W=Math.max(180,el.clientWidth||260),H=54; el.innerHTML='';
  const svg=d3.select(el).append('svg').attr('viewBox',`0 0 ${W} ${H}`).attr('aria-hidden','true');
  const x=d3.scaleLinear().domain([0,vals.length-1]).range([2,W-4]);
  const ext=d3.extent(vals); const y=d3.scaleLinear().domain(o.dom||[Math.min(ext[0],-1),Math.max(ext[1],1)]).range([H-3,3]);
  if(o.zero!==false) svg.append('line').attr('x1',0).attr('x2',W).attr('y1',y(0)).attr('y2',y(0)).attr('stroke',css('--line'));
  svg.append('path').datum(vals).attr('fill',color).attr('opacity',.12).attr('d',d3.area().x((d,i)=>x(i)).y0(y(o.base??0)).y1(d=>y(d)).curve(d3.curveMonotoneX));
  svg.append('path').datum(vals).attr('fill','none').attr('stroke',color).attr('stroke-width',1.6).attr('d',d3.line().x((d,i)=>x(i)).y(d=>y(d)).curve(d3.curveMonotoneX));
  svg.append('circle').attr('cx',x(vals.length-1)).attr('cy',y(vals[vals.length-1])).attr('r',3).attr('fill',color);
}
function hbars(el, rows, o={}){
  el.innerHTML='';const W=Math.max(260,Math.min(760,el.clientWidth||o.w||520)),bh=o.bh||20,gap=6,m={l:o.left||140,r:54};
  const H=rows.length*(bh+gap)+4;const svg=d3.select(el).append('svg').attr('viewBox',`0 0 ${W} ${H}`);
  const x=d3.scaleLinear().domain([o.min??0,o.max??d3.max(rows,r=>r.v)]).range([m.l,W-m.r]);
  rows.forEach((r,i)=>{const yy=i*(bh+gap)+2;
    svg.append('text').attr('x',m.l-8).attr('y',yy+bh/2).attr('dy','.35em').attr('text-anchor','end').text(r.label).style('fill',css('--ink'));
    const x0=x(Math.max(0,x.domain()[0])),x1=x(r.v);
    svg.append('rect').attr('x',Math.min(x0,x1)).attr('y',yy).attr('width',Math.max(1,Math.abs(x1-x0))).attr('height',bh).attr('rx',2).attr('fill',r.color||css('--accent'));
    svg.append('text').attr('x',Math.max(x0,x1)+6).attr('y',yy+bh/2).attr('dy','.35em').text(o.fmt?o.fmt(r.v):fmt(r.v)).attr('font-family','var(--mono)');
  });
  if(x.domain()[0]<0) svg.append('line').attr('x1',x(0)).attr('x2',x(0)).attr('y1',0).attr('y2',H).attr('stroke',css('--muted'));
}
function groupedBars(el, groups, keys, colors, o={}){
  el.innerHTML='';const W=Math.max(320,el.clientWidth||o.w||640),H=o.h||240,m={t:16,r:10,b:30,l:40};
  const svg=d3.select(el).append('svg').attr('viewBox',`0 0 ${W} ${H}`);
  const x0=d3.scaleBand().domain(groups.map(g=>g.name)).range([m.l,W-m.r]).padding(.25);
  const x1=d3.scaleBand().domain(keys).range([0,x0.bandwidth()]).padding(.08);
  const vals=groups.flatMap(g=>keys.map(k=>g[k]));
  const y=d3.scaleLinear().domain([Math.min(0,d3.min(vals)*1.35),o.max??Math.max(1,d3.max(vals))]).nice().range([H-m.b,m.t]);
  svg.append('g').attr('class','gridl').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-(W-m.l-m.r)).tickFormat(o.yfmt||d3.format('.1f'))).call(g=>g.select('.domain').remove()).call(g=>g.selectAll('text').attr('x',-6));
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x0).tickSize(0)).call(g=>g.select('.domain').remove()).call(g=>g.selectAll('text').attr('dy','1.1em').style('fill',css('--ink')).style('font-size','13px'));
  svg.append('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',y(0)).attr('y2',y(0)).attr('stroke',css('--muted'));
  groups.forEach(g=>keys.forEach((k,i)=>{const v=g[k];const yy=y(Math.max(0,v)),h=Math.abs(y(v)-y(0));
    svg.append('rect').attr('x',x0(g.name)+x1(k)).attr('y',yy).attr('width',x1.bandwidth()).attr('height',Math.max(1,h)).attr('fill',colors[i]).attr('rx',2)
      .on('mouseenter',e=>showTip(e,`<b>${esc(g.name)}</b><div>${esc(o.labels?o.labels[i]:k)}: <b>${fmt(v,3)}</b></div>`)).on('mousemove',moveTip).on('mouseleave',hideTip);
    if(o.valueLabels) svg.append('text').attr('x',x0(g.name)+x1(k)+x1.bandwidth()/2).attr('y',v>=0?yy-4:yy+h+11).attr('text-anchor','middle').text(fmt(v,2)).attr('font-family','var(--mono)').style('font-size','10px');
  }));
}
const legend = items => `<div class="legend">${items.map(([c,l])=>`<span><i style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>`;
const levelLegend = () => legend([...LEVELS.map(l=>[lvColor(l),l]),[css('--nodata'),'No recent data']]);
const chip = l => `<span class="chip" style="background:${lvColor(l)};color:${['Typical','Low','Elevated'].includes(l)?'#13222a':'#fff'};${l==='Typical'?'border-color:var(--typ-line)':''}">${esc(l)}</span>`;

/* ---------- routing ---------- */
const VIEWS=[['dashboard','Dashboard'],['map','Surveillance map'],['analytics','Trends & timing'],['predictive','Predictive models'],['equity','Coverage & equity'],['tennessee','Tennessee'],['genomics','Genomics & AMR'],['structures','Protein structures'],['alerts','Alerts'],['myalerts','My alerts'],['audit','Audit log'],['methods','Methods & sources'],['about','About & contact']];
const built={};
let PRESET_STATE='', ALERT_STATE='';
const nav=document.getElementById('nav');
const highAlerts=D.alerts.filter(a=>a.severity==='high').length;
nav.innerHTML=VIEWS.map(([k,l])=>`<button data-v="${k}">${l}${k==='alerts'?`<span class="count">${D.alerts.length}</span>`:''}</button>`).join('');
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});
const rail=document.querySelector('.rail'),menubtn=document.getElementById('menubtn');
menubtn.addEventListener('click',()=>{const o=rail.classList.toggle('open');menubtn.setAttribute('aria-expanded',o)});
let lastW=innerWidth,rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(Math.abs(innerWidth-lastW)<40)return;lastW=innerWidth;Object.keys(built).forEach(k=>delete built[k]);const v=location.hash.slice(1)||'dashboard';if(VIEWS.some(x=>x[0]===v)){RENDER[v]();built[v]=true}},200)});
function go(v,push=true){
  if(!VIEWS.some(x=>x[0]===v))v='dashboard';
  VIEWS.forEach(([k])=>{document.getElementById('v-'+k).hidden=k!==v});
  nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===v?'page':'false'));
  if(!built[v]){RENDER[v]();built[v]=true}
  if(push&&location.hash!=='#'+v){try{history.replaceState(null,'','#'+v)}catch(e){}}
  try{localStorage.setItem('nwgs_view',v);if(v!=='about')localStorage.setItem('nwgs_last',v)}catch(e){}
  rail.classList.remove('open');menubtn.setAttribute('aria-expanded','false');
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.dataset.go)}});

/* ---------- status strip ---------- */
const R=D.run;
const pulledYear=new Date(R.data_pulled_utc).getUTCFullYear();
const copyYears=pulledYear>2026?`2026–${pulledYear}`:'2026';
document.querySelectorAll('.cy').forEach(e=>e.textContent=copyYears);
document.querySelectorAll('.footmail').forEach(e=>e.innerHTML=`<a href="mailto:${EMAIL}">${EMAIL}</a>`);
const gateCls=R.gate_status==='PASS'?'ok':R.gate_status==='BLOCKED'?'bad':'warn';
document.getElementById('status').innerHTML=
  `<span>Latest sample <b style="color:var(--ink)">${dateFmt(D.latest_sample||R.data_as_of)}</b></span>
   <span class="opt-s">CDC data updated ${new Date(R.data_pulled_utc).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})} · refreshed every Saturday</span>
   <button class="pill ${gateCls}" data-go="audit" title="${R.n_pass} pass · ${R.n_warning} warnings · ${R.n_fail} fail"><i></i>Validated: ${R.n_pass} checks passed${R.n_fail?` · ${R.n_fail} failed`:''}</button>
   ${R.consistency_ok?'':'<button class="pill warn" data-go="audit"><i></i>Tables from mixed runs (test build)</button>'}
   <span id="acct" class="acct"></span>`;

const S = Object.fromEntries(D.summary.map(s=>[s.pathogen,s]));
const ser = p => D.trend[p].map(([w,z])=>[new Date(w),z]);
const highCount = p => Object.values(D.activity[p]).filter(([z])=>z>1).length;

/* ---------- views ---------- */
const RENDER={
dashboard(){
  const el=document.getElementById('v-dashboard');
  const arrow=t=>t==='Increasing'?'<span class="trend-up">▲ Increasing</span>':t==='Decreasing'?'<span class="trend-down">▼ Decreasing</span>':'<span class="trend-flat">● Stable</span>';
  el.innerHTML=`
  <div class="head"><h1>Respiratory virus signals in U.S. wastewater</h1>
  <p class="muted">Site-standardized wastewater activity for the four weeks ending ${dateFmt(D.activity_end)}, with clinical alignment, spatial clustering and coverage equity from the same weekly run.</p></div>
  <div class="grid">${ROUTINE.map(p=>{const s=S[p];const l=level(s.recent_median_site_z);return `
    <article class="panel card-p c4"><div class="top"><h2>${p}</h2>${chip(l)}</div>
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="big">${fmt(s.recent_median_site_z)}</span><span class="small muted">median site z</span><span class="small">${arrow(s.trend)}</span></div>
      <div class="chart" id="sp-${p.replace(/\W/g,'')}"></div>
      <div class="kv small"><div><span class="label">Sites</span><b>${s.sites.toLocaleString()}</b></div><div><span class="label">Counties</span><b>${s.counties_represented.toLocaleString()}</b></div><div><span class="label">High now</span><b style="color:var(--hi)">${highCount(p)}</b></div></div>
      <p class="small muted">Change vs previous window: <span class="num">${s.change_vs_previous_window_z>0?'+':''}${fmt(s.change_vs_previous_window_z)}</span> z · last 52 weeks shown</p>
    </article>`}).join('')}
  </div>
  <div class="grid">
    <article class="panel c7"><header><h2>Emerging pathogen detections</h2><span class="small muted">share of sites with a positive test, latest window</span></header>
      <div class="grid" style="gap:12px">${EMERGING.map(p=>{const s=S[p];return `<div class="c4" style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="label">${p}</span><span class="big" style="font-size:1.6rem">${pct(s.recent_detection_rate)}</span><div class="chart" id="se-${p.replace(/\W/g,'')}"></div><span class="small muted">${s.sites.toLocaleString()} sites · since ${dateFmt(s.first_observation)}</span></div>`}).join('')}</div>
    </article>
    <article class="panel c5"><header><h2>Latest alerts</h2><a href="#alerts" data-go="alerts" class="small">All ${D.alerts.length} alerts</a></header>
      <div>${[...D.alerts].sort((a,b)=>['high','moderate','info'].indexOf(a.severity)-['high','moderate','info'].indexOf(b.severity)).filter((a,i,arr)=>a.severity!=='high'||arr.filter(x=>x.severity==='high').indexOf(a)<2).slice(0,5).map(alertRow).join('')}</div>
    </article>
  </div>
  <p class="note">Levels compare each site with its own history (within-site log-concentration z-score), then take the county or national median. They describe relative change, not case counts.</p>`;
  ROUTINE.forEach(p=>spark(document.getElementById('sp-'+p.replace(/\W/g,'')),D.trend[p].slice(-52).map(d=>d[1]),css('--accent')));
  EMERGING.forEach(p=>spark(document.getElementById('se-'+p.replace(/\W/g,'')),D.emerging[p].slice(-52).map(d=>d[1]*100),css('--warn'),{zero:false,base:0,dom:[0,Math.max(3,d3.max(D.emerging[p].slice(-52),d=>d[1]*100))]}));
},

map(){
  const el=document.getElementById('v-map');
  el.innerHTML=`<div class="head"><h1>Surveillance map</h1><p class="muted">County wastewater activity, spatial clusters and surveillance coverage. Hover or tap a county for details.</p></div>
  <div class="controls"><div class="seg" id="m-path">${ROUTINE.map((p,i)=>`<button aria-pressed="${i===0}" data-p="${p}">${p}</button>`).join('')}</div>
  <div class="seg" id="m-layer"><button aria-pressed="true" data-l="activity">Recent activity</button><button aria-pressed="false" data-l="cluster">Spatial clusters</button><button aria-pressed="false" data-l="coverage">Coverage</button></div></div>

  <div class="panel" id="m-stats"></div></div></div>`;
  let P='SARS-CoV-2',L='activity';

  const covBins=[[0,'No data','--nodata'],[25,'1–25 weeks','--accent-soft'],[51,'26–51','--lo'],[103,'52–103','--vl'],[155,'104–155','--accent'],[1e9,'≥156 weeks','--ink']];
  const covCol=w=>{if(!w)return css('--nodata');for(const [m,,c] of covBins.slice(1)) if(w<=m) return css(c);};
  const info=f=>{const a=D.activity[P][f],c=D.clusters[P][f],v=D.coverage[f];
    return `<b>${cname(f)}</b><div>${P} activity: ${a?`<b>${fmt(a[0])}</b> z (${level(a[0])}), ${a[1]} site${a[1]>1?'s':''}`:'no recent data'}</div><div>Cluster: ${c||'—'}</div><div>Coverage: ${v?`${v[0]} weeks${v[1]?', analysis-ready':''}`:'none'}</div>${v&&v[2]!=null?`<div>SVI: ${fmt(v[2])}</div>`:''}`};
  function draw(){
    const color=L==='activity'?f=>{const a=D.activity[P][f];return a?lvColor(level(a[0])):css('--nodata')}
      :L==='cluster'?f=>{const c=D.clusters[P][f];return c?css(CL[c]):css('--nodata')}
      :f=>covCol(D.coverage[f]?.[0]);
    countyMap(document.getElementById('m-map'),color,info,{label:`${P} ${L} map`,onClick:f=>{document.getElementById('m-detail').innerHTML=info(f)}});
    document.getElementById('m-legend').innerHTML=L==='activity'?levelLegend()+`<p class="note">Four weeks ending ${dateFmt(D.activity_end)}. ${Object.keys(D.activity[P]).length} counties with recent data.</p>`
      :L==='cluster'?legend(Object.entries(CL).map(([k,v])=>[css(v),k]).concat([[css('--nodata'),'No recent data']]))+'<p class="note">Local Moran’s I with k=6 nearest neighbours; cluster classes shown at permutation p&lt;0.05.</p>'
      :legend(covBins.map(([,l,c])=>[css(c),l]))+'<p class="note">Most qualifying weeks across SARS-CoV-2, RSV and influenza A.</p>';
    const s=D.spatial.find(x=>x.pathogen===P);const vals=Object.values(D.activity[P]).map(a=>level(a[0]));
    document.getElementById('m-stats').innerHTML=`<span class="label">${P} · national picture</span>
      <div class="statgrid" style="grid-template-columns:1fr 1fr"><div><span class="label">Moran’s I</span><div class="big" style="font-size:1.5rem">${fmt(s.morans_i,3)}</div><span class="small muted">p = ${s.p_sim}</span></div><div><span class="label">Counties</span><div class="big" style="font-size:1.5rem">${s.n_counties}</div><span class="small muted">in spatial analysis</span></div></div>
      <div class="tbl"><table><tr><th>Level</th><th class="n">Counties</th></tr>${LEVELS.slice().reverse().map(l=>`<tr><td>${chip(l)}</td><td class="n">${vals.filter(v=>v===l).length}</td></tr>`).join('')}</table></div>
      <p class="small muted">High-High clusters: <b class="num">${s['high-high']}</b> · Low-Low: <b class="num">${s['low-low']}</b></p>`;
  }
  el.querySelector('#m-path').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;P=b.dataset.p;el.querySelectorAll('#m-path button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});

  draw();
},

analytics(){
  const el=document.getElementById('v-analytics');
  const lagSum=p=>{const r=D.statelag.filter(x=>x.pathogen===p);return {n:r.length,sync:r.filter(x=>x.lag_weeks===0).length,lead:r.filter(x=>x.lag_weeks>0).length,rho:d3.median(r,x=>x.spearman_r),sig:r.filter(x=>x.significant_fdr).length}};
  el.innerHTML=`<div class="head"><h1>Trends & timing</h1><p class="muted">National wastewater activity, how closely it tracks emergency-department visits, and when seasons peak.</p></div>
  <article class="panel"><header><h2>National wastewater activity</h2><div class="seg" id="a-path">${ROUTINE.map((p,i)=>`<button aria-pressed="${i===0}" data-p="${p}">${p}</button>`).join('')}</div></header>
  <div class="chart" id="a-trend"></div>${legend([['var(--vl)','Very Low ≤ −1'],['var(--lo)','Low'],['var(--el)','Elevated'],['var(--hi)','High > 1']])}</article>
  <div class="grid">
  <article class="panel c7"><header><h2>Wastewater vs. emergency-department timing</h2></header>
    <div class="seg" id="a-lagp">${ROUTINE.map((p,i)=>`<button aria-pressed="${i===0}" data-p="${p}">${p}</button>`).join('')}</div>
    <div class="mapbox" id="a-lagmap"></div>${legend([['var(--accent)','Same week'],['var(--el)','Wastewater leads'],['var(--nodata)','Not significant or no data']])}</article>
  <article class="panel c5"><header><h2>By pathogen</h2><span class="small muted">best lag per state</span></header>
    <div class="tbl"><table class="tight"><tr><th>Pathogen</th><th class="n">Same week</th><th class="n">WW leads</th><th class="n">Median <span class="nocase">ρ</span></th><th class="n">FDR sig.</th></tr>
    ${ROUTINE.map(p=>{const s=lagSum(p);return `<tr><td class="nw">${p}</td><td class="n">${s.sync}/${s.n}</td><td class="n">${s.lead}</td><td class="n">${fmt(s.rho)}</td><td class="n">${s.sig}/${s.n}</td></tr>`}).join('')}</table></div>
    <p class="note">Most states peak in the same week in wastewater and clinical data. Leads, where present, are almost always one week. Significance uses FDR-corrected Spearman tests.</p></article>
  </div>
  <div class="grid">
  <article class="panel c7"><header><h2>National seasonal peaks</h2><span class="small muted">complete July–June seasons</span></header>
    <div class="tbl"><table class="tight"><tr><th>Pathogen</th><th>Season</th><th>Wastewater peak</th><th>Clinical peak</th><th class="n">Lead (wk)</th><th class="n">Peak z</th></tr>
    ${D.seasonal.map(s=>`<tr><td class="nw">${s.pathogen}</td><td class="mono nw">${s.season}</td><td>${dateFmt(s.ww_peak_week)}</td><td>${dateFmt(s.clinical_peak_week)}</td><td class="n">${s.ww_lead_to_clinical_peak_weeks>0?'+':''}${s.ww_lead_to_clinical_peak_weeks}${s.implausible_lead_flag?' <span class="flag">⚑</span>':''}</td><td class="n">${fmt(s.ww_peak_magnitude_z)}</td></tr>`).join('')}</table></div>
    <p class="note">Positive lead = wastewater peaked first. At state level, ${D.state_seasons.flagged} of ${D.state_seasons.n} eligible state-seasons are flagged for implausible leads (${D.state_seasons.by.map(b=>`${b.pathogen} ${b.flagged}`).join(', ')}).</p></article>
  <article class="panel c5"><header><h2>Emerging pathogens</h2><div class="seg" id="a-em">${EMERGING.map((p,i)=>`<button aria-pressed="${i===0}" data-p="${p}">${p.replace('Influenza A(H5)','H5')}</button>`).join('')}</div></header>

  </div>`;
  let P='SARS-CoV-2';
  const drawT=()=>lineChart(document.getElementById('a-trend'),[{name:P,values:ser(P),color:css('--accent'),area:false}],{bands:true,zero:true,w:900,h:260});
  const drawLag=p=>{const by=Object.fromEntries(D.statelag.filter(x=>x.pathogen===p).map(x=>[x.state_code,x]));
    stateMap(document.getElementById('a-lagmap'),st=>{const r=by[st];return !r||!r.significant_fdr?css('--nodata'):r.lag_weeks>0?css('--el'):css('--accent')},
      (st,name)=>{const r=by[st];return r?`<b>${esc(name)}</b><div>${r.relationship}${r.lag_weeks?` by ${r.lag_weeks} wk`:''}</div><div>ρ = ${fmt(r.spearman_r)} · ${r.paired_weeks} weeks</div>${r.significant_fdr?'':'<div>Not significant after FDR</div>'}`:`<b>${esc(name)}</b><div>No qualifying data</div>`})};
  const drawEm=p=>lineChart(document.getElementById('a-emc'),[{name:p,values:D.emerging[p].filter(d=>d[2]>=20).map(d=>[new Date(d[0]),d[1]]),color:css('--warn'),area:true}],{ymin:0,ymax:Math.max(.01,d3.max(D.emerging[p].filter(d=>d[2]>=20),d=>d[1])*1.15),yfmt:d3.format('.0%'),tipfmt:v=>pct(v),w:440,h:260,left:40,xticks:4});
  const seg=(id,fn)=>el.querySelector(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;el.querySelectorAll(id+' button').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset.p)});
  seg('#a-path',p=>{P=p;drawT()});seg('#a-lagp',drawLag);seg('#a-em',drawEm);
  drawT();drawLag('SARS-CoV-2');drawEm('Influenza A(H5)');
},

predictive(){
  const el=document.getElementById('v-predictive');
  const M=Object.fromEntries(D.models.map(m=>[m.pathogen,m]));
  const interp=m=>{const w=m.wastewater_only_r2,g=m.gain_over_persistence;
    const solo=w<=0?`On its own, wastewater did not predict ED visits in the test period (R² ${fmt(w,2)}).`
      :`On its own, wastewater explains about ${Math.round(w*100)}% of the week-to-week variation in ED visits (R² ${fmt(w,2)}).`;
    const add=g>=0.02?`Added to recent ED data, it raises R² by ${fmt(g,3)}.`
      :w>0?`Most of that signal overlaps with last week’s ED value, so adding it to the model changes R² by only ${g>0?'+':''}${fmt(g,3)}.`
      :`Adding it to the model changes R² by only ${g>0?'+':''}${fmt(g,3)}.`;
    return solo+' '+add};
  el.innerHTML=`<div class="head"><h1>Predictive models</h1><p class="muted">Does wastewater help predict emergency-department burden? Each model was trained on earlier weeks and tested on a later held-out period.</p></div>
  <article class="panel"><header><h2>Held-out accuracy (R²)</h2></header><div class="chart" id="p-bars"></div>
  ${legend([['var(--muted)','Clinical history only (persistence)'],['var(--el)','Wastewater only'],['var(--accent)','Full multimodal model']])}</article>
  <div class="grid">${ROUTINE.map(p=>{const m=M[p];return `<article class="panel c4"><header><h2>${p}</h2><span class="small mono">${m.best_model}</span></header>
    <p style="font-weight:600">${esc(m.plain_language)}</p>
    <div class="kv small"><div><span class="label">Full R²</span><b>${fmt(m.full_model_r2,3)}</b></div><div><span class="label">Clinical only</span><b>${fmt(m.clinical_persistence_r2,3)}</b></div><div><span class="label">Gain</span><b>${m.gain_over_persistence>0?'+':''}${fmt(m.gain_over_persistence,3)}</b></div></div>
    <p class="small muted">${interp(m)}</p>
    <span class="label">Top predictors (mean |SHAP|)</span><div class="chart" id="p-shap-${p.replace(/\W/g,'')}"></div></article>`}).join('')}</div>
  <p class="note">Wastewater features (orange) are often strongly correlated with last week’s clinical value (r up to 0.77), so a small SHAP rank inside the full model can understate wastewater’s standalone signal. That is why the wastewater-only model is shown separately.</p>`;
  groupedBars(document.getElementById('p-bars'),ROUTINE.map(p=>({name:p,a:M[p].clinical_persistence_r2,b:M[p].wastewater_only_r2,c:M[p].full_model_r2})),['a','b','c'],[css('--muted'),css('--el'),css('--accent')],{labels:['Clinical only','Wastewater only','Full model'],valueLabels:true,max:1,w:1000,h:300});
  ROUTINE.forEach(p=>hbars(document.getElementById('p-shap-'+p.replace(/\W/g,'')),D.shap.filter(s=>s.pathogen===p).slice(0,8).map(s=>({label:FEAT(s.feature),v:s.mean_abs_shap,color:/^(ww_|wastewater)/.test(s.feature)?css('--el'):css('--muted')})),{left:150,w:360,bh:18,fmt:v=>v<.01?v.toFixed(3):v.toFixed(2)}));
},

},

alerts(){
  const el=document.getElementById('v-alerts');
  let P='All', ST=ALERT_STATE||'';
  const pathogens=P=>P==='All'?ROUTINE:[P];
  // High counties per state, from this run's county activity (same rule as the weekly alerts: z > 1)
  const highBy=()=>{const out={};pathogens(P).forEach(p=>Object.entries(D.activity[p]||{}).forEach(([f,v])=>{if(v[0]>1&&D.names[f]){const s=D.names[f][1];(out[s]??={total:0,by:{}});out[s].total++;(out[s].by[p]??=[]).push([D.names[f][0],v[0]])}}));return out};
  const other=D.alerts.filter(a=>a.severity!=='high');
  el.innerHTML=`<div class="head"><h1>Alerts</h1><p class="muted">Where wastewater activity is High (z&nbsp;>&nbsp;1) in the four weeks ending ${dateFmt(D.activity_end)}. Click a state on the map or choose one below.</p></div>
  <div class="controls"><div class="seg" id="al-p">${['All',...ROUTINE].map(p=>`<button aria-pressed="${p==='All'}" data-p="${p}">${p==='All'?'All three':p}</button>`).join('')}</div>
    <label class="selectwrap"><span class="sr">State</span><select id="al-st"></select></label></div>
  <div class="grid">
    <article class="panel c8"><div class="mapbox" id="al-map"></div><div id="al-legend"></div></article>
    <div class="c4 stackcol"><article class="panel" id="al-sum"></article>${other.length?`<article class="panel"><h2>National signals</h2><div>${other.map(alertRow).join('')}</div></article>`:''}</div>
  </div>
  <div id="al-list" class="statecards"></div>
  <p class="note">Same rule as the weekly email alerts: a county is High when its median site z-score over the latest four weeks is above 1.0.</p>
  <div class="head" style="margin-top:12px"><span class="eyebrow">Emerging pathogens</span><h2 style="font-size:1.5rem">Where H5 bird flu, measles and mpox were detected</h2><p class="muted">CDC tests these as detected / not detected. A site counts as positive if any sample tested positive in the latest four weeks.</p></div>
  <div class="controls"><div class="seg" id="em-p">${EMERGING.map((p,i)=>`<button aria-pressed="${i===0}" data-p="${p}">${p==='Influenza A(H5)'?'H5 bird flu':p}</button>`).join('')}</div></div>
  <div class="grid"><article class="panel c8"><div class="mapbox" id="em-map"></div><div id="em-legend"></div></article><article class="panel c4" id="em-list"></article></div>`;
  const sel=document.getElementById('al-st');
  function draw(){
    const H=highBy(), max=Math.max(1,d3.max(Object.values(H),d=>d.total)||1);
    const col=d3.scaleLinear().domain([1,max]).range([css('--hi-soft'),css('--hi')]).interpolate(d3.interpolateRgb);
    const states=Object.keys(H).sort((a,b)=>H[b].total-H[a].total||STATE_NAMES[a].localeCompare(STATE_NAMES[b]));
    sel.innerHTML=`<option value="">All states (${states.length} with High counties)</option>`+Object.keys(STATE_NAMES).sort((a,b)=>STATE_NAMES[a].localeCompare(STATE_NAMES[b])).map(s=>`<option value="${s}"${s===ST?' selected':''}>${esc(STATE_NAMES[s])}${H[s]?` — ${H[s].total} High`:''}</option>`).join('');
    // map
    const box=document.getElementById('al-map');box.innerHTML='';
    const svg=d3.select(box).append('svg').attr('viewBox','0 0 975 610').attr('role','img').attr('aria-label','States by number of counties at High');
    svg.append('g').selectAll('path').data(statesFeat).join('path').attr('d',path).attr('class','st')
      .attr('fill',d=>{const s=STATE_FIPS[d.id],h=H[s];return h?col(h.total):css('--nodata')})
      .attr('stroke',d=>STATE_FIPS[d.id]===ST?css('--gold'):css('--surface')).attr('stroke-width',d=>STATE_FIPS[d.id]===ST?3:1)
      .style('cursor','pointer')
      .on('mouseenter',(e,d)=>{const s=STATE_FIPS[d.id],h=H[s];showTip(e,`<b>${esc(d.properties.name)}</b><div>${h?`${h.total} ${h.total>1?'counties':'county'} at High`:'No counties at High'}</div>${h?Object.entries(h.by).map(([p,c])=>`<div>${p}: ${c.length}</div>`).join(''):''}`)})
      .on('mousemove',moveTip).on('mouseleave',hideTip)
      .on('click',(e,d)=>{const s=STATE_FIPS[d.id];ST=ST===s?'':s;draw();if(ST&&innerWidth<1100)document.getElementById('al-list').scrollIntoView({behavior:'smooth',block:'start'})});
    svg.selectAll('path.st').filter(d=>STATE_FIPS[d.id]===ST).raise();
    document.getElementById('al-legend').innerHTML=`<div class="legend"><span>Counties at High:</span><span><i style="background:${col(1)}"></i>1</span>${max>2?`<span><i style="background:${col(Math.round((1+max)/2))}"></i>${Math.round((1+max)/2)}</span>`:''}<span><i style="background:${col(max)}"></i>${max}${max>1?'':''}</span><span><i style="background:${css('--nodata')}"></i>None</span></div>`;
    // summary
    const tot=d3.sum(Object.values(H),d=>d.total), top=states.slice(0,3);
    document.getElementById('al-sum').innerHTML=`<span class="label">${P==='All'?'All three viruses':esc(P)}</span>
      <div class="sumrow"><div><span class="big">${tot}</span><span class="small muted">counties at High</span></div><div><span class="big">${states.length}</span><span class="small muted">states</span></div></div>
      ${top.length?`<p class="small">Most counties at High: ${top.map(s=>`<button class="linkbtn" data-st="${s}">${esc(STATE_NAMES[s])} (${H[s].total})</button>`).join(', ')}.</p>`:'<p class="small muted">No counties are at High right now.</p>'}
      <a class="btn" href="#myalerts" data-go="myalerts">Get email alerts</a>`;
    // state cards
    const show=ST?[ST]:states;
    document.getElementById('al-list').innerHTML=(ST?`<div class="filterbar"><span>Showing <b>${esc(STATE_NAMES[ST])}</b></span><button class="btn small" id="al-clear">Show all states</button></div>`:'')+
      (show.length?`<div class="grid">${show.map(s=>{const h=H[s];return `<article class="panel c4 statecard"><header><h2>${esc(STATE_NAMES[s])}</h2><span class="small muted">${h?`${h.total} at High`:'none at High'}</span></header>
        ${h?Object.entries(h.by).map(([p,c])=>`<div class="pblock"><div class="ptitle"><span class="dot" style="background:var(--hi)"></span>${p} <span class="muted small">· ${c.length} ${c.length>1?'counties':'county'}</span></div><p class="small">${c.sort((a,b)=>b[1]-a[1]).map(([n,z])=>`${esc(n.replace(/ (County|Parish|Borough|Census Area|Municipality)$/,''))} <span class="muted mono">${fmt(z,1)}</span>`).join(' · ')}</p></div>`).join(''):`<p class="small muted">No counties with wastewater sites are at High for ${P==='All'?'these viruses':esc(P)} right now.</p>`}
        <button class="btn small" data-alertme="${s}">Alert me for ${esc(STATE_NAMES[s])}</button></article>`}).join('')}</div>`:'<p class="muted">No counties are at High right now.</p>');
  }
  el.querySelector('#al-p').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;P=b.dataset.p;el.querySelectorAll('#al-p button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
  sel.addEventListener('change',()=>{ST=sel.value;draw()});
  el.addEventListener('click',e=>{const b=e.target.closest('[data-st],#al-clear,[data-alertme]');if(!b)return;
    if(b.id==='al-clear'){ST='';draw();return}
    if(b.dataset.st){ST=b.dataset.st;draw();return}
    if(b.dataset.alertme){PRESET_STATE=b.dataset.alertme;delete built.myalerts;go('myalerts')}});
  draw();
  // ---- emerging pathogens by state ----
  let EP=EMERGING[0];
  function drawEm(){
    const box=document.getElementById('em-map'),list=document.getElementById('em-list'),leg=document.getElementById('em-legend');
    const EC=D.emerging_county&&D.emerging_county[EP];
    if(!EC){box.innerHTML='';leg.innerHTML='';list.innerHTML=`<p class="small muted">State-level detections appear after the next weekly update. National trends are on the <a href="#dashboard" data-go="dashboard">dashboard</a>.</p>`;return}
    const byS={};Object.entries(EC).forEach(([f,[tested,det,last]])=>{const n=D.names[f];if(!n)return;const s=n[1];(byS[s]??={tested:0,det:0,counties:[]});byS[s].tested+=tested;byS[s].det+=det;if(det>0)byS[s].counties.push([n[0],det,last])});
    const maxD=Math.max(1,d3.max(Object.values(byS),d=>d.det)||1);
    const col=d3.scaleLinear().domain([1,maxD]).range([css('--gold-soft'),css('--warn')]).interpolate(d3.interpolateRgb);
    box.innerHTML='';const svg=d3.select(box).append('svg').attr('viewBox','0 0 975 610').attr('role','img').attr('aria-label',`${EP} detections by state`);
    svg.append('g').selectAll('path').data(statesFeat).join('path').attr('d',path).attr('stroke',css('--surface')).attr('stroke-width',1)
      .attr('fill',d=>{const s=byS[STATE_FIPS[d.id]];return !s?css('--nodata'):s.det?col(s.det):css('--accent-soft')})
      .on('mouseenter',(e,d)=>{const s=byS[STATE_FIPS[d.id]];showTip(e,`<b>${esc(d.properties.name)}</b><div>${s?`${s.det} of ${s.tested} tested sites with a detection`:'No sites tested'}</div>`)}).on('mousemove',moveTip).on('mouseleave',hideTip);
    leg.innerHTML=legend([[col(1),'Sites with a detection: 1'],[col(maxD),String(maxD)],[css('--accent-soft'),'Tested, none detected'],[css('--nodata'),'No sites tested']]);
    const pos=Object.entries(byS).filter(([,v])=>v.det).sort((a,b)=>b[1].det-a[1].det);
    const tested=d3.sum(Object.values(byS),v=>v.tested),det=d3.sum(Object.values(byS),v=>v.det);
    list.innerHTML=`<span class="label">${EP==='Influenza A(H5)'?'H5 bird flu':EP} · four weeks ending ${dateFmt(D.emerging_window_end)}</span>
      <div class="sumrow"><div><span class="big">${det}</span><span class="small muted">sites with a detection</span></div><div><span class="big">${pos.length}</span><span class="small muted">states</span></div></div>
      <p class="small muted">${tested.toLocaleString()} sites tested in ${Object.keys(byS).length} states.</p>
      ${pos.length?`<ul class="emlist">${pos.map(([s,v])=>`<li><b>${esc(STATE_NAMES[s]||s)}</b> <span class="muted small">${v.det} of ${v.tested} sites</span><div class="small">${v.counties.map(([n])=>esc(n.replace(/ (County|Parish|Borough|Census Area|Municipality)$/,''))).join(' · ')}</div></li>`).join('')}</ul>`:'<p class="small">No detections in this window.</p>'}`;
  }
  el.querySelector('#em-p').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;EP=b.dataset.p;el.querySelectorAll('#em-p button').forEach(x=>x.setAttribute('aria-pressed',x===b));drawEm()});
  drawEm();
},

audit(){
  const el=document.getElementById('v-audit');
  const cls=s=>s.startsWith('PASS')?'PASS':s.startsWith('FAIL')?'FAIL':'WARN';
  el.innerHTML=`<div class="head"><h1>Audit log</h1><p class="muted">Every validation check from this run. The app only updates when no check fails.</p></div>
  <div class="statgrid"><div class="stat"><span class="label">Run</span><span class="mono">${R.run_id}</span></div><div class="stat"><span class="label">Gate</span><span class="big" style="font-size:1.2rem">${R.gate_status.replace(/_/g,' ')}</span></div><div class="stat"><span class="label">Checks</span><span class="mono">${R.n_pass} pass · ${R.n_warning} warn · ${R.n_fail} fail</span></div><div class="stat"><span class="label">Same-run tables</span><span class="big" style="font-size:1.2rem;color:${R.consistency_ok?'var(--ok)':'var(--warn)'}">${R.consistency_ok?'Yes':'No'}</span></div></div>
  ${R.consistency_ok?'':'<p class="callout">This test build mixes Table07 from one pipeline run with Table13 from another (county counts differ by 1–2). The production export blocks this; rerun the pipeline once and export every table from that run.</p>'}
  <article class="panel"><div class="tbl"><table class="stack"><tr><th>Component</th><th>Status</th><th>Detail</th><th>Source</th></tr>
  ${D.audit.map(a=>{const phil=/PHIL/.test(a.component)&&/PARTIAL_IMAGES/.test(a.status);return `<tr><td class="lead">${esc(a.component)}</td><td class="status-${phil?'INFO':cls(a.status)}" style="white-space:nowrap;font-weight:600">${phil?'INFO · OPTIONAL':esc(a.status.replace(/_/g,' '))}</td><td class="small" style="max-width:52ch;overflow-wrap:anywhere">${esc(a.detail).replace(/; /g,';<wbr> ')}${phil?'. Optional photos from CDC’s image library (PHIL), which blocks automated downloads; no analysis uses them.':''}</td><td class="small muted" data-l="Source">${esc(a.source)}</td></tr>`}).join('')}</table></div></article>`;
},

methods(){
  const el=document.getElementById('v-methods');
  const acc=new Date(R.data_pulled_utc).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  el.innerHTML=`<div class="head"><h1>Methods &amp; sources</h1><p class="muted">How the numbers on this site are made, and every dataset and tool they come from.</p></div>
  <article class="panel"><header><h2>Data sources &amp; references</h2><span class="small muted">accessed ${acc}</span></header>
  <ol class="refs">
    ${D.sources.map(s=>`<li>Centers for Disease Control and Prevention. <i>${esc(s.dataset_name)}</i> [dataset <span class="mono">${s.dataset_id}</span>]. National Wastewater Surveillance System (NWSS). data.cdc.gov; updated ${dateFmt(String(s.updated_utc).slice(0,10))}; ${s.rows.toLocaleString()} rows. <a href="${s.source_url}" target="_blank" rel="noopener">${s.source_url.replace('https://','')}</a></li>`).join('')}
    <li>Centers for Disease Control and Prevention. <i>NSSP Emergency Department Visit Trajectories by State and Sub State Regions: COVID-19, Flu, RSV, Combined</i> [dataset <span class="mono">rdmq-nq56</span>]. National Syndromic Surveillance Program. <a href="https://data.cdc.gov/d/rdmq-nq56" target="_blank" rel="noopener">data.cdc.gov/d/rdmq-nq56</a></li>
    <li>Centers for Disease Control and Prevention. <i>PLACES: Local Data for Better Health, County Data</i> [dataset <span class="mono">swc5-untb</span>]. County health context measures. <a href="https://data.cdc.gov/d/swc5-untb" target="_blank" rel="noopener">data.cdc.gov/d/swc5-untb</a></li>
    <li>Centers for Disease Control and Prevention / Agency for Toxic Substances and Disease Registry / Geospatial Research, Analysis, and Services Program. <i>CDC/ATSDR Social Vulnerability Index 2022 Database, US (county)</i>. <a href="https://www.atsdr.cdc.gov/place-health/php/svi/" target="_blank" rel="noopener">atsdr.cdc.gov/place-health/php/svi</a></li>
    <li>U.S. Census Bureau. <i>2025 TIGER/Line Shapefiles: Counties</i>. <a href="https://www.census.gov/geographies/mapping-files/time-series/geo/tiger-line-file.html" target="_blank" rel="noopener">census.gov TIGER/Line</a></li>
    <li><i>U.S. wastewater antimicrobial-resistance gene (ARG) detections, 2024</i> [file US_Wastewater_AMR_ARG_2024.csv]. Used for the resistance-gene panels. Full source citation pending.</li>
    <li>National Center for Biotechnology Information. <i>NCBI Virus</i> and <i>NCBI Datasets API v2</i>. National Library of Medicine. <a href="https://www.ncbi.nlm.nih.gov/datasets/" target="_blank" rel="noopener">ncbi.nlm.nih.gov/datasets</a></li>
    <li>Berman HM, Westbrook J, Feng Z, et al. The Protein Data Bank. <i>Nucleic Acids Research</i>. 2000;28(1):235–242. RCSB PDB entries ${D.structures.map(s=>`<a href="https://doi.org/10.2210/pdb${s.pdb_entry_id}/pdb" target="_blank" rel="noopener">${s.pdb_entry_id}</a>`).join(', ')}. <a href="https://www.rcsb.org" target="_blank" rel="noopener">rcsb.org</a></li>
    <li>Bostock M. <i>us-atlas</i>: U.S. state and county boundaries in TopoJSON, derived from U.S. Census Bureau cartographic boundary files. ISC License. <a href="https://github.com/topojson/us-atlas" target="_blank" rel="noopener">github.com/topojson/us-atlas</a></li>
    <li>Bostock M, Ogievetsky V, Heer J. D³: Data-Driven Documents. <i>IEEE Transactions on Visualization and Computer Graphics</i>. 2011;17(12):2301–2309. Also used: topojson-client (ISC).</li>
    <li>Rego N, Koes D. 3Dmol.js: molecular visualization with WebGL. <i>Bioinformatics</i>. 2015;31(8):1322–1324.</li>
  </ol>
  <p class="small muted">All CDC, Census, NCBI and RCSB data are public and remain subject to their providers’ terms. NWGS Grid™ is not affiliated with or endorsed by CDC.</p></article>
  <div class="grid"><article class="panel c12"><h2>Measures</h2><ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
    <li><b>Activity level</b> — within-site z-score of log concentration, median across a county’s sites for the latest 4 weeks. Very Low ≤ −1, Low ≤ −0.25, Typical ≤ 0.25, Elevated ≤ 1, High &gt; 1.</li>
    <li><b>Analysis-ready</b> — at least 52 qualifying weeks and at least 70% completeness across the active span.</li>
    <li><b>Timing</b> — Spearman correlation between state wastewater and ED activity at lags of 0–6 weeks, FDR-corrected; best lag reported.</li>
    <li><b>Seasonal peaks</b> — complete July–June seasons only; leads near season boundaries are flagged.</li>
    <li><b>Clusters</b> — global and local Moran’s I, k=6 nearest neighbours, EPSG:5070, permutation inference.</li>
    <li><b>Models</b> — random forest and gradient boosting vs. clinical persistence on a chronological holdout; ablation, wastewater-only benchmark and SHAP.</li></ul></article></div>
  <p class="note">The site is one static page generated from the weekly pipeline export. It is rebuilt every Saturday after CDC’s weekly NWSS refresh, and only when no validation check fails.</p>`;

};

function alertRow(a){return `<div class="alert"><span class="bar sev-${a.severity}"></span><div style="min-width:0;display:flex;flex-direction:column;gap:3px"><div class="meta"><b style="color:var(--ink)">${esc(a.alert_type)}</b>${a.pathogen?`<span>${esc(a.pathogen)}</span>`:''}${a.geography?`<span>${esc(a.geography)}</span>`:''}</div><p class="small">${isoTxt(a.message)}</p></div></div>`}

/* ---------- accounts (Supabase) ---------- */
const SUPA_CFG = JSON.parse(document.getElementById('supa').textContent||'null');
let SB=null, USER=null;
try{ if(SUPA_CFG&&window.supabase) SB=window.supabase.createClient(SUPA_CFG.url,SUPA_CFG.publishableKey,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}}) }catch(e){SB=null}
const STATE_NAMES=Object.fromEntries(statesFeat.map(f=>[STATE_FIPS[f.id],f.properties.name]).filter(([k])=>k));
const RANK={'Very Low':0,'Low':1,'Typical':2,'Elevated':3,'High':4};
function drawAcct(){const el=document.getElementById('acct');if(!el)return;
  if(!SB){el.innerHTML='';return}
  el.innerHTML=USER?`<span class="small">${esc(USER.email)}</span> · <button id="acct-out">Sign out</button>`:`<button data-go="myalerts">Sign in</button>`;
  const o=document.getElementById('acct-out');if(o)o.onclick=async()=>{await SB.auth.signOut()}}
function rerender(v){delete built[v];if(!document.getElementById('v-'+v).hidden){RENDER[v]();built[v]=true}}
if(SB){
  SB.auth.onAuthStateChange((ev,session)=>{const u=session?.user||null;const changed=(u?.id||null)!==(USER?.id||null);USER=u;drawAcct();
    if(ev==='SIGNED_IN'&&/[?&]code=/.test(location.search)){try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}}
    if(changed){setTimeout(()=>{rerender('myalerts');rerender('about')},0)}});
}
const formMsg=(el,ok,text)=>{el.className='msg '+(ok?'ok':'err');el.textContent=text;el.hidden=false};
function levelNow(rule){const a=D.activity[rule.pathogen]||{};
  if(rule.area_type==='county'){const v=a[rule.area_code];return v?`${level(v[0])} now (z ${fmt(v[0])})`:'No recent data'}
  const hits=Object.entries(a).filter(([f,v])=>D.names[f]?.[1]===rule.area_code&&RANK[level(v[0])]>=RANK[rule.min_level]).length;
  return hits?`${hits} ${hits>1?'counties':'county'} at ${rule.min_level==='High'?'High':'Elevated or High'} now`:'None at that level now'}

/* ---------- boot ---------- */
drawAcct();
let start=location.hash.slice(1);
if(!start){try{start=localStorage.getItem('nwgs_view')||''}catch(e){}}
go(start||'dashboard',false);
addEventListener('hashchange',()=>go(location.hash.slice(1),false));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{Object.keys(built).forEach(k=>delete built[k]);go(location.hash.slice(1)||'dashboard',false)});
new MutationObserver(()=>{Object.keys(built).forEach(k=>delete built[k]);go(location.hash.slice(1)||'dashboard',false)}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
