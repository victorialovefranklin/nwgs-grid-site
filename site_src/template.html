structures(){
  const el=document.getElementById('v-structures');
  // Validation is only ever claimed when the run explicitly records a completed
  // review. Absent or unknown status never reads as validated.
  const reviewLine=()=>{const s=D.regions_review;
    if(!s)return 'Status: no functional regions in this run yet. They are imported on the next weekly update and will arrive marked as awaiting expert review.';
    if(s.startsWith('reviewed'))return `Status: reviewed and validated—${esc(s.replace(/^reviewed_by[_:]?\s*/,''))}.`;
    return '⚠ Status: imported automatically from UniProt and not yet reviewed by a structural biology collaborator. Residue ranges are provisional; verify against the cited UniProt entry before using them in any analysis or publication.'};
  const RT=['Domain','Region','Motif','Binding site','Active site','Functional site','Topological domain','Transmembrane','Intramembrane','Signal peptide','Coiled coil'];
  const regionBlock=s=>{const rs=(D.regions||{})[s.pdb_entry_id]||[];
    if(!rs.length)return `<p class="small muted">Functional regions appear here after the next weekly update.</p>`;
    const ordered=[...rs].sort((a,b)=>(RT.indexOf(a.feature_type)-RT.indexOf(b.feature_type))||(a.pdb_start-b.pdb_start));
    return `<div class="regions"><h3>Functional regions <span class="muted small">· ${ordered.length} from UniProt</span></h3>
      <ul class="rlist">${ordered.map(r=>`<li><button class="rbtn" data-mol="${s.pdb_entry_id}" data-name="${esc(s.pathogen+' · '+s.protein)}" data-chain="${esc(r.pdb_chain)}" data-start="${r.pdb_start}" data-end="${r.pdb_end}" data-rname="${esc(r.feature_description)}" title="Highlight in 3D">
        <span class="rtype rt-${esc(String(r.feature_type).toLowerCase().replace(/\s+/g,'-'))}">${esc(r.feature_type)}</span>
        <span class="rname">${esc(r.feature_description)}</span>
        <span class="rres mono">${esc(r.pdb_chain)} ${r.pdb_start===r.pdb_end?r.pdb_start:`${r.pdb_start}–${r.pdb_end}`}</span></button></li>`).join('')}</ul>
      <p class="small muted">Residues shown in this structure’s numbering. Source: UniProt <span class="mono">${esc(ordered[0].uniprot_accession||'')}</span>.</p></div>`};
  el.innerHTML=`<div class="head"><h1>Protein structures</h1><p class="muted">One reference structure per pathogen from the RCSB Protein Data Bank, each passing the pipeline’s structural QC. Each card lists the protein’s curated functional regions from UniProt, mapped onto that structure’s own residue numbering; select a region to highlight it in 3D.</p></div>
  <div class="grid">${D.structures.map(s=>`<article class="panel c4 scard">
    <figure class="sfig">
      <div class="sfig-ph" aria-hidden="true"><span class="mono">${s.pdb_entry_id}</span></div>
      <img loading="lazy" alt="${esc(s.protein)} (PDB ${s.pdb_entry_id}) structure image" src="${esc(s.image_url||`img/structures/${s.pdb_entry_id}.png`)}" data-alt="img/structures/${s.pdb_entry_id}.png" onerror="if(this.dataset.alt&&this.src.indexOf(this.dataset.alt)<0){this.src=this.dataset.alt}else{this.hidden=true}">
      <span class="sfig-tag mono">${s.method.replace('ELECTRON MICROSCOPY','Cryo-EM').replace('X-RAY DIFFRACTION','X-ray')} · ${fmt(s.resolution_a,2)} Å</span>
    </figure>
    <div class="shead"><h2>${s.pathogen}</h2><p class="sprot">${esc(s.protein)}</p><p class="small muted stitle">${esc(s.rcsb_title)}</p></div>
    <dl class="sspec">
      <div><dt>Method</dt><dd>${s.method.replace('ELECTRON MICROSCOPY','Cryo-EM').replace('X-RAY DIFFRACTION','X-ray')}</dd></div>
      <div><dt>Resolution</dt><dd class="mono">${fmt(s.resolution_a,2)} Å</dd></div>
      <div><dt>Cα atoms</dt><dd class="mono">${s.ca_atom_count.toLocaleString()}</dd></div>
    </dl>
    ${regionBlock(s)}
    <div class="sact"><button class="btn primary" data-mol="${s.pdb_entry_id}" data-name="${esc(s.pathogen+' · '+s.protein)}">View in 3D</button>
      <a class="btn small" href="${s.pdb_entry_url}" target="_blank" rel="noopener">PDB ${s.pdb_entry_id} ↗</a></div>
    <p class="small muted sref">UniProt <span class="mono">${esc((s.uniprot_ids||'').replace(/;/g,', '))}</span> · QC ${s.figure_component_qc} · <a href="https://doi.org/10.2210/pdb${s.pdb_entry_id}/pdb" target="_blank" rel="noopener">doi:10.2210/pdb${s.pdb_entry_id}/pdb</a></p>
    </article>`).join('')}</div>
  <article class="panel scope"><h2>About these annotations</h2>
    <p class="small">Functional regions are imported unchanged from <a href="https://www.uniprot.org" target="_blank" rel="noopener">UniProtKB</a>’s curated feature table for the same protein each structure contains. Residue ranges are converted from UniProt numbering to the structure’s own author numbering using RCSB’s published sequence alignments, so a highlighted region sits where the depositors placed it. Regions UniProt lists but the structure does not resolve are left out rather than approximated.</p>
    <p class="small">This is a reference and surveillance layer: NWGS Grid™ reproduces and cites published annotations alongside the structure they describe. It does not predict, score or rank anything about these regions, and it is not intended as design guidance. Every row carries its UniProt accession and evidence codes so any claim can be traced to its source.</p>
    <p class="small ${D.regions_review&&D.regions_review.startsWith('reviewed')?'muted':'pending'}">${reviewLine()}</p></article>
  <p class="note">Images and coordinates: RCSB Protein Data Bank (Berman et al., 2000). Functional regions: UniProt Consortium, <i>Nucleic Acids Research</i> 2025. 3D viewer: 3Dmol.js (Rego &amp; Koes, 2015). Reference structures give biological context only; they are not derived from wastewater samples.</p>
  ${assayPanel()}
  <dialog id="mol" class="moldlg"><div class="molhead"><div><b id="mol-t"></b><span class="small muted" id="mol-r"></span></div><button class="btn small" id="mol-x">Close</button></div><div class="molbody"><div id="mol-v" class="molview"><p class="muted small" style="padding:16px">Loading 3D model…</p></div><aside id="mol-leg" class="mollegend" hidden></aside></div><p class="small muted" style="padding:10px 14px 12px">Drag to rotate · scroll or pinch to zoom · coordinates: RCSB PDB · <a id="mol-alt" href="#" target="_blank" rel="noopener">Open in RCSB 3D viewer ↗</a></p></dialog>`;
  const dlg=document.getElementById('mol');
  document.getElementById('mol-x').onclick=()=>dlg.close();
  el.addEventListener('click',async e=>{const b=e.target.closest('[data-mol]');if(!b)return;
    const id=b.dataset.mol,reg=b.dataset.start?{chain:b.dataset.chain,start:+b.dataset.start,end:+b.dataset.end,name:b.dataset.rname}:null;
    document.getElementById('mol-t').textContent=`${b.dataset.name} (PDB ${id})`;
    document.getElementById('mol-r').textContent=reg?` — highlighting ${reg.name}, chain ${reg.chain} ${reg.start===reg.end?reg.start:`${reg.start}–${reg.end}`}`:'';
    document.getElementById('mol-alt').href=`https://www.rcsb.org/3d-view/${id}`;
    const v=document.getElementById('mol-v');v.innerHTML='<p class="muted small" style="padding:16px">Loading 3D model…</p>';
    try{dlg.showModal()}catch(_){dlg.setAttribute('open','')}
    try{
      if(!window.$3Dmol) await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/3dmol@2.4.0/build/3Dmol-min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
      // coordinates straight from RCSB: mmCIF first (every entry has it), legacy PDB format as a fallback
      let txt=null,fmt='cif';
      for(const [u,f] of [[`https://files.rcsb.org/download/${id}.cif`,'cif'],[`https://files.rcsb.org/download/${id}.pdb`,'pdb']]){
        try{const r=await fetch(u);if(r.ok){txt=await r.text();fmt=f;break}}catch(_){}}
      if(!txt) throw new Error('no coordinates');
      v.innerHTML='';
      const dark=matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.dataset.theme!=='light';
      const viewer=$3Dmol.createViewer(v,{backgroundColor:dark?'#131d33':'white'});
      viewer.addModel(txt,fmt);
      const all=((D.regions||{})[id]||[]).filter(r=>r.pdb_start!=null);
      const leg=document.getElementById('mol-leg');
      // one color per region, stable across openings
      all.forEach((r,i)=>{r._c=RCOL[i%RCOL.length]});
      const resiOf=r=>r.pdb_start===r.pdb_end?String(r.pdb_start):`${r.pdb_start}-${r.pdb_end}`;
      const nameAt=(ch,resi)=>{const m=all.filter(r=>r.pdb_chain===ch&&resi>=r.pdb_start&&resi<=r.pdb_end);
        return m.length?m.map(r=>r.feature_description).join(' \u00b7 '):null};

      function paint(focus){
        viewer.removeAllLabels();
        if(!all.length){
          viewer.setStyle({},{cartoon:{color:'spectrum'}});
        }else if(focus){
          viewer.setStyle({},{cartoon:{color:'#cfd4dd',opacity:.5}});
          const sel={chain:focus.pdb_chain,resi:resiOf(focus)};
          viewer.setStyle(sel,{cartoon:{color:focus._c}});
          viewer.addStyle(sel,{stick:{radius:.12,color:focus._c}});
          addPointer(focus);
        }else{
          viewer.setStyle({},{cartoon:{color:'#cfd4dd',opacity:.6}});
          all.forEach(r=>viewer.setStyle({chain:r.pdb_chain,resi:resiOf(r)},{cartoon:{color:r._c}}));
        }
        viewer.setStyle({hetflag:true},{});
        viewer.render();
        if(focus){viewer.zoomTo({chain:focus.pdb_chain,resi:resiOf(focus)},800)}else{viewer.zoomTo();viewer.render();viewer.zoom(1.05,600)}
      }
      // a labeled pointer sitting on the focused region
      function addPointer(r){
        try{
          viewer.addLabel(`${r.feature_description}  ${r.pdb_chain} ${resiOf(r)}`,
            {backgroundColor:'#14213a',backgroundOpacity:.92,fontColor:'#f7f1e8',fontSize:13,
             borderThickness:1.4,borderColor:r._c,inFront:true,showBackground:true},
            {chain:r.pdb_chain,resi:resiOf(r)});
        }catch(_){}
      }
      // pop-up annotation under the cursor
      viewer.setHoverable({},true,(atom,vw)=>{
        if(atom.__lab)return;
        const nm=nameAt(atom.chain,atom.resi);
        atom.__lab=vw.addLabel(nm?`${nm}\n${atom.chain} ${atom.resn||''}${atom.resi}`:`${atom.chain} ${atom.resn||''}${atom.resi}`,
          {position:atom,backgroundColor:'#14213a',backgroundOpacity:.92,fontColor:'#f7f1e8',fontSize:11,inFront:true});
        vw.render();
      },(atom,vw)=>{if(atom.__lab){vw.removeLabel(atom.__lab);delete atom.__lab;vw.render()}});

      if(all.length){
        leg.hidden=false;
        leg.innerHTML=`<h3>Regions</h3><p class="small muted">Select one to focus it. Hover the model for residue details.</p>
          <button class="btn small" data-focus="all">Show all regions</button>
          <ul class="mlist">${all.map((r,i)=>`<li><button class="mbtn" data-focus="${i}"><span class="msw" style="background:${r._c}"></span><span class="mnm">${esc(r.feature_description)}</span><span class="mono rres">${esc(r.pdb_chain)} ${resiOf(r)}</span></button></li>`).join('')}</ul>
          <p class="small muted">Source: UniProt <span class="mono">${esc(all[0].uniprot_accession||'')}</span> · ranges in this structure’s numbering · not yet expert-reviewed.</p>`;
        leg.onclick=ev=>{const b=ev.target.closest('[data-focus]');if(!b)return;
          const f=b.dataset.focus==='all'?null:all[+b.dataset.focus];
          leg.querySelectorAll('.mbtn').forEach(x=>x.classList.toggle('on',x===b));
          document.getElementById('mol-r').textContent=f?` — ${f.feature_description}, chain ${f.pdb_chain} ${resiOf(f)}`:' — all annotated regions';
          paint(f)};
      }else{leg.hidden=true;leg.innerHTML=''}
      paint(reg?all.find(r=>r.pdb_chain===reg.chain&&r.pdb_start===reg.start&&r.pdb_end===reg.end)||null:null);
    }catch(err){v.innerHTML=`<p class="small" style="padding:16px">The 3D model could not load in this browser. <a href="https://www.rcsb.org/3d-view/${id}" target="_blank" rel="noopener">Open it in the RCSB 3D viewer ↗</a></p>`}
  });
},

      <p class="note">Emails go out after each weekly update when a rule matches, at most once per rule per week.</p></article></div>`;

about(){
  const el=document.getElementById('v-about');
  const mail=(subj,body)=>`mailto:${EMAIL}?subject=${encodeURIComponent(subj)}${body?`&body=${encodeURIComponent(body)}`:''}`;
  const site=location.protocol.startsWith('http')?location.origin+location.pathname:'https://victorialovefranklin.github.io/nwgs-grid-site/';
  const tnNow=(D.tn_county||[]).filter(c=>c.reporting_now).length;
  el.innerHTML=`<div class="head"><h1>About &amp; contact</h1><p class="muted">Who built NWGS Grid™, why, and how to reach her, cite the work or request a license.</p></div>
  <div class="grid aboutgrid">
  <figure class="panel c4 portrait"><img src="img/vlf-portrait.jpg" alt="Portrait of Victoria Love Franklin" width="1080" height="1439" loading="lazy"></figure>
  <article class="panel c8 bio"><h2>Victoria Love Franklin, PSM, CPT</h2>
    <p class="role">Developer · PhD Student, Data Science · Research Scholar</p>
    <p>Victoria Love Franklin is a data scientist, GIS scientist and web developer based in Nashville, Tennessee. She began her doctoral training at Meharry Medical College in <b>Biomedical Data Science</b> and broadened into Data Science with a cybersecurity concentration, while continuing to research <b>structural biology</b> — the protein-level side of the pathogens this system tracks. Her work spans five federal laboratories (Idaho National Laboratory, Savannah River National Laboratory, Oak Ridge National Laboratory, the U.S. Naval Research Laboratory and the U.S. Air Force School of Aerospace Medicine), as well as local government and industry.</p>
    <p>As an ORISE Genomic Epidemiology Fellow at the U.S. Air Force School of Aerospace Medicine, she integrated wastewater, genomic, epidemiological and clinical data for infectious-disease biosurveillance. She has since trained in metagenomic next-generation sequencing with the Chan Zuckerberg Biohub, and she teaches and mentors students in data science, GIS and AI. That biomedical and structural grounding is why NWGS Grid™ carries reference protein structures and their curated functional regions alongside the surveillance data.</p>
    <div class="controls">
      <a class="btn primary" href="${mail('NWGS Grid inquiry')}">Email Victoria</a>
      <a class="btn" href="https://victorialovefranklin.github.io/victoria-franklin-site/" target="_blank" rel="noopener">Personal website ↗</a>
      <a class="btn" href="https://github.com/victorialovefranklin" target="_blank" rel="noopener">GitHub ↗</a>
    </div>
    </article>
  </div>
  <div class="grid">
  <article class="panel c12 why"><img class="wlogo" src="img/nwgs-logo.webp" alt="NWGS Grid™ logo: National Wastewater Genomic Surveillance" width="520" height="496" loading="lazy"><h2>Why I built NWGS Grid™</h2>
    <p class="lede">Wastewater carries an early, community-wide signal of infection that doesn’t depend on who gets tested or who goes to the doctor.</p>
    <p>But that signal is spread across separate CDC datasets, clinical feeds and vulnerability indices. It changes every week, and it reaches some communities far better than others. I built NWGS Grid™ to bring those streams together in one validated pipeline that rebuilds itself every week, so public-health teams, researchers and residents can see where respiratory and emerging pathogens are rising, how closely wastewater tracks emergency-department visits, and which communities surveillance still misses.</p>
    <p><b>NWGS Grid™ is independent work.</b> Victoria created and built every part of it — the pipeline, the validation checks, the weekly automation and this site — outside any employer, fellowship or sponsored program, using only public data.</p>
    <p>That last question is personal. In my home state of Tennessee, ${tnNow} of 95 counties report wastewater data to CDC today.</p>
    <p class="sig">— Victoria</p></article>

  <article class="panel c12 origin"><h2>Where this came from</h2>
    <p>NWGS Grid™ began as a poster. In 2025 Victoria proposed a conceptual framework for combining GIS and metagenomics to enhance wastewater surveillance — presented at the <b>Wastewater Disease Surveillance Summit</b>, and awarded <b>First Place</b> for the School of Applied Computational Sciences at the <b>69th Annual Research Day</b> at Meharry Medical College.</p>
    <figure class="posterfig">
      <img src="img/poster-gis-metagenomics.webp" alt="Research poster: Using GIS and Metagenomics to Enhance Wastewater Surveillance, by Victoria Love Franklin, Todd Gary, Bishnu Sarker and Reginald Archer." loading="lazy">
      <figcaption class="small muted">Franklin VL, Gary T, Sarker B, Archer R. “Using GIS and Metagenomics to Enhance Wastewater Surveillance.” School of Applied Computational Sciences, Meharry Medical College; Department of Environmental Sciences, Tennessee State University (2025).</figcaption>
    </figure>
    <h3>The continuation of that work</h3>
    <p>The poster was campus-scale and proposed. NWGS Grid™ is national-scale and running. Three threads carried directly across:</p>
    <div class="tbl"><table class="stack"><tr><th>In the 2025 poster</th><th>In NWGS Grid™ today</th></tr>
      <tr><td class="lead" data-l="In the poster">“Create a real-time Wastewater Surveillance GIS Dashboard to contextualize sewage, map and evaluate viral activity, and the potential impact of detected pathogens.”</td>
          <td data-l="Today" class="small">The dashboard exists and rebuilds itself weekly across every reporting U.S. county, with spatial cluster statistics and county-level activity mapping. <a href="#map" data-go="map">Surveillance map</a></td></tr>
      <tr><td class="lead" data-l="In the poster">“Reporting delays have the potential to significantly distort the relationship between reported and real disease incidence.”</td>
          <td data-l="Today" class="small">That observation is now measured rather than asserted. Lead time is decomposed into shedding lead, reporting lag and operational lead, so the delay the poster identified is quantified in weeks. <a href="#leadtime" data-go="leadtime">Lead time</a></td></tr>
      <tr><td class="lead" data-l="In the poster">“Identify distinct spatial patterns in the distribution of targeted pathogens, correlating patterns with secondary data.”</td>
          <td data-l="Today" class="small">Local spatial clustering is computed each week and correlated against clinical emergency-department data and social vulnerability. <a href="#equity" data-go="equity">Coverage &amp; equity</a></td></tr>
    </table></div>
    <p class="small muted">The poster’s stated limitation — missing sewer-access location data for the study site — is the same problem that the representativeness measure now addresses at national scale: you cannot describe who surveillance reaches without knowing where the sewershed actually is.</p>
    <p class="note">The poster was collaborative work with the co-authors named above. <b>NWGS Grid™ is independent work</b> that followed it: Victoria created and built every part of the platform herself, outside any employer, fellowship or sponsored program, using only public data.</p></article>
  <article class="panel domains"><h2>Domains</h2>
    <p class="small">Victoria’s work runs along one thread: the critical systems communities depend on — health, energy, environment — and the geospatial and AI methods that reveal where those systems are strong, where they fail and whom they reach. NWGS Grid™ is the public-health expression of that thread.</p>
    <div class="tbl"><table class="stack dtable"><tr><th>Domain</th><th>Focus</th><th>Areas</th></tr><tr><td class="lead dname" data-l="Domain">Biosurveillance &amp; public health</td><td data-l="Focus" class="small">Turning environmental and clinical signals into early warning, and asking who the system reaches.</td><td data-l="Areas"><ul class="tags"><li>Wastewater biosurveillance</li><li>Genomic epidemiology</li><li>Spatial epidemiology</li><li>Metagenomics &amp; NGS</li><li>Structural biology</li><li>Health equity &amp; social vulnerability</li></ul></td></tr><tr><td class="lead dname" data-l="Domain">Critical infrastructure &amp; cybersecurity</td><td data-l="Focus" class="small">Protecting operational systems and modelling how they behave under stress.</td><td data-l="Areas"><ul class="tags"><li>Nuclear cybersecurity</li><li>ICS/OT security</li><li>Power grids &amp; smart grids</li><li>Grid resilience</li><li>Digital twins</li><li>Anomaly detection</li></ul></td></tr><tr><td class="lead dname" data-l="Domain">Environment &amp; remote sensing</td><td data-l="Focus" class="small">Measuring land, air and climate pressure from satellite and sensor data.</td><td data-l="Areas"><ul class="tags"><li>GIS &amp; geospatial intelligence</li><li>Remote sensing</li><li>Forestry &amp; biomass</li><li>Carbon sequestration</li><li>Air quality</li><li>Climate hazards &amp; wildfire risk</li></ul></td></tr><tr><td class="lead dname" data-l="Domain">AI &amp; application development</td><td data-l="Focus" class="small">Building the models, pipelines and interfaces that put the analysis in people’s hands.</td><td data-l="Areas"><ul class="tags"><li>App development, front end &amp; back end</li><li>Machine learning &amp; explainable AI</li><li>Retrieval-augmented generation (RAG)</li><li>Automated data pipelines</li><li>Dashboards &amp; public data portals</li></ul></td></tr></table></div>
    <p class="small muted">Full project history on her <a href="https://victorialovefranklin.github.io/victoria-franklin-site/" target="_blank" rel="noopener">personal website</a>.</p></article>

alerts(){
  const el=document.getElementById('v-alerts');
  let P='All', ST=ALERT_STATE||'';
  const pathogens=P=>P==='All'?ROUTINE:[P];
  // High counties per state, from this run's county activity (same rule as the weekly alerts: z > 1)
  const highBy=()=>{const out={};pathogens(P).forEach(p=>Object.entries(D.activity[p]||{}).forEach(([f,v])=>{if(v[0]>1&&D.names[f]){const s=D.names[f][1];(out[s]??={total:0,by:{}});out[s].total++;(out[s].by[p]??=[]).push([D.names[f][0],v[0]])}}));return out};
  const other=D.alerts.filter(a=>a.severity!=='high');
  el.innerHTML=`<div class="head"><h1>Alerts</h1><p class="muted">Where wastewater activity is High (z&nbsp;>&nbsp;1) in the four weeks ending ${dateFmt(D.activity_end)}. Click a state on the map or choose one below.</p></div>
  <div class="controls"><div class="seg" id="al-p">${['All',...ROUTINE].map(p=>`<button aria-pressed="${p==='All'}" data-p="${p}">${p==='All'?'All three':p}</button>`).join('')}</div>
    <label class="selectwrap"><span class="sr">State</span><select id="al-st"></select></label></div>
  <div class="grid">
    <article class="panel ${other.length?'c5':'c12'}" id="al-sum"></article>
    ${other.length?`<article class="panel c7"><h2>National signals</h2><div class="natsig">${other.map(alertRow).join('')}</div></article>`:''}
    <article class="panel c12"><div class="mapbox" id="al-map"></div><div id="al-legend"></div></article>
  </div>
  <div id="al-list" class="statecards"></div>
  <p class="note">Same rule as the weekly email alerts: a county is High when its median site z-score over the latest four weeks is above 1.0. Each chip gives the county and that z-score, and values of <span class="zkey z2">2.0 and above</span> or <span class="zkey z3">3.0 and above</span> are emphasised so the strongest signals stand out. A z-score compares a site only against its own history, so a high value means unusual for that place, not more cases than somewhere else.</p>
  <div class="head" style="margin-top:12px"><span class="eyebrow">Emerging pathogens</span><h2 style="font-size:1.5rem">Where H5 bird flu, measles and mpox were detected</h2><p class="muted">CDC tests these as detected / not detected. A site counts as positive if any sample tested positive in the latest four weeks.</p></div>
  <div class="controls"><div class="seg" id="em-p">${EMERGING.map((p,i)=>`<button aria-pressed="${i===0}" data-p="${p}">${p==='Influenza A(H5)'?'H5 bird flu':p}</button>`).join('')}</div></div>
  <div class="grid"><article class="panel c12"><div class="mapbox" id="em-map"></div><div id="em-legend"></div></article><article class="panel c12" id="em-list"></article></div>`;
  const sel=document.getElementById('al-st');
  function draw(){
    const H=highBy(), max=Math.max(1,d3.max(Object.values(H),d=>d.total)||1);
    const col=d3.scaleLinear().domain([1,max]).range([css('--hi-soft'),css('--hi')]).interpolate(d3.interpolateRgb);
    const states=Object.keys(H).sort((a,b)=>H[b].total-H[a].total||STATE_NAMES[a].localeCompare(STATE_NAMES[b]));
    sel.innerHTML=`<option value="">All states (${states.length} with High counties)</option>`+Object.keys(STATE_NAMES).sort((a,b)=>STATE_NAMES[a].localeCompare(STATE_NAMES[b])).map(s=>`<option value="${s}"${s===ST?' selected':''}>${esc(STATE_NAMES[s])}${H[s]?` — ${H[s].total} High`:''}</option>`).join('');
    // map
    const box=document.getElementById('al-map');box.innerHTML='';
    const svg=d3.select(box).append('svg').attr('viewBox','0 0 975 610').attr('role','img').attr('aria-label','States by number of counties at High');
    svg.append('g').selectAll('path').data(statesFeat).join('path').attr('d',path).attr('class','st')
      .attr('fill',d=>{const s=STATE_FIPS[d.id],h=H[s];return h?col(h.total):css('--nodata')})
      .attr('stroke',d=>STATE_FIPS[d.id]===ST?css('--gold'):css('--surface')).attr('stroke-width',d=>STATE_FIPS[d.id]===ST?3:1)
      .style('cursor','pointer')
      .on('mouseenter',(e,d)=>{const s=STATE_FIPS[d.id],h=H[s];showTip(e,`<b>${esc(d.properties.name)}</b><div>${h?`${h.total} ${h.total>1?'counties':'county'} at High`:'No counties at High'}</div>${h?Object.entries(h.by).map(([p,c])=>`<div>${p}: ${c.length}</div>`).join(''):''}`)})
      .on('mousemove',moveTip).on('mouseleave',hideTip)
      .on('click',(e,d)=>{const s=STATE_FIPS[d.id];ST=ST===s?'':s;draw();if(ST&&innerWidth<1100)document.getElementById('al-list').scrollIntoView({behavior:'smooth',block:'start'})});
    svg.selectAll('path.st').filter(d=>STATE_FIPS[d.id]===ST).raise();
    document.getElementById('al-legend').innerHTML=`<div class="legend"><span>Counties at High:</span><span><i style="background:${col(1)}"></i>1</span>${max>2?`<span><i style="background:${col(Math.round((1+max)/2))}"></i>${Math.round((1+max)/2)}</span>`:''}<span><i style="background:${col(max)}"></i>${max}${max>1?'':''}</span><span><i style="background:${css('--nodata')}"></i>None</span></div>`;
    // summary
    const tot=d3.sum(Object.values(H),d=>d.total), top=states.slice(0,3);
    document.getElementById('al-sum').innerHTML=`<h2>${P==='All'?'All three viruses':esc(P)}</h2>
      <div class="sumrow"><div><span class="big">${tot}</span><span class="small muted">counties at High</span></div><div><span class="big">${states.length}</span><span class="small muted">states</span></div></div>
      ${top.length?`<p class="small">Most counties at High: ${top.map(s=>`<button class="linkbtn" data-st="${s}">${esc(STATE_NAMES[s])} (${H[s].total})</button>`).join(', ')}.</p>`:'<p class="small muted">No counties are at High right now.</p>'}
      <a class="btn" href="#myalerts" data-go="myalerts">Get email alerts</a>`;
    // state cards
    const show=ST?[ST]:states;
    document.getElementById('al-list').innerHTML=(ST?`<div class="filterbar"><span>Showing <b>${esc(STATE_NAMES[ST])}</b></span><button class="btn small" id="al-clear">Show all states</button></div>`:'')+
      (show.length?`<div class="grid">${show.map(s=>{const h=H[s];return `<article class="panel c4 statecard"><header><h2>${esc(STATE_NAMES[s])}</h2><span class="small muted">${h?`${h.total} at High`:'none at High'}</span></header>
        ${h?Object.entries(h.by).map(([p,c])=>`<div class="pblock"><div class="ptitle"><span class="dot" style="background:${pcol(p)}"></span>${p} <span class="muted small">· ${c.length} ${c.length>1?'counties':'county'}</span></div><ul class="clist">${c.sort((a,b)=>b[1]-a[1]).map(([n,z])=>`<li class="${zband(z)}"><span class="cname">${esc(n.replace(/ (County|Parish|Borough|Census Area|Municipality)$/,''))}</span><span class="cz mono">${fmt(z,1)}</span></li>`).join('')}</ul></div>`).join(''):`<p class="small muted">No counties with wastewater sites are at High for ${P==='All'?'these viruses':esc(P)} right now.</p>`}
        <button class="btn small" data-alertme="${s}">Alert me for ${esc(STATE_NAMES[s])}</button></article>`}).join('')}</div>`:'<p class="muted">No counties are at High right now.</p>');
  }
  el.querySelector('#al-p').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;P=b.dataset.p;el.querySelectorAll('#al-p button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
  sel.addEventListener('change',()=>{ST=sel.value;draw()});
  el.addEventListener('click',e=>{const b=e.target.closest('[data-st],#al-clear,[data-alertme]');if(!b)return;
    if(b.id==='al-clear'){ST='';draw();return}
    if(b.dataset.st){ST=b.dataset.st;draw();return}
    if(b.dataset.alertme){PRESET_STATE=b.dataset.alertme;delete built.myalerts;go('myalerts')}});
  draw();
  // ---- emerging pathogens by state ----
  let EP=EMERGING[0];
  function drawEm(){
    const box=document.getElementById('em-map'),list=document.getElementById('em-list'),leg=document.getElementById('em-legend');
    const EC=D.emerging_county&&D.emerging_county[EP];
    if(!EC){box.innerHTML='';leg.innerHTML='';
      list.innerHTML=notLoaded(`County detections for ${EP}`,
        'CDC NWSS emerging-pathogen datasets (H5, measles and mpox), summarised to county level for the latest four weeks',
        'CDC reports these three as detected / not detected rather than as activity levels, so this layer needs the per-county detection table from the run. National trends for the same pathogens are on the <a href="#dashboard" data-go="dashboard">dashboard</a>.');
      return}
    const byS={};Object.entries(EC).forEach(([f,[tested,det,last]])=>{const n=D.names[f];if(!n)return;const s=n[1];(byS[s]??={tested:0,det:0,counties:[]});byS[s].tested+=tested;byS[s].det+=det;if(det>0)byS[s].counties.push([n[0],det,last])});
    const maxD=Math.max(1,d3.max(Object.values(byS),d=>d.det)||1);
    const col=d3.scaleLinear().domain([1,maxD]).range([css('--gold-soft'),css('--warn')]).interpolate(d3.interpolateRgb);
    box.innerHTML='';const svg=d3.select(box).append('svg').attr('viewBox','0 0 975 610').attr('role','img').attr('aria-label',`${EP} detections by state`);
    svg.append('g').selectAll('path').data(statesFeat).join('path').attr('d',path).attr('stroke',css('--surface')).attr('stroke-width',1)
      .attr('fill',d=>{const s=byS[STATE_FIPS[d.id]];return !s?css('--nodata'):s.det?col(s.det):css('--accent-soft')})
      .on('mouseenter',(e,d)=>{const s=byS[STATE_FIPS[d.id]];showTip(e,`<b>${esc(d.properties.name)}</b><div>${s?`${s.det} of ${s.tested} tested sites with a detection`:'No sites tested'}</div>`)}).on('mousemove',moveTip).on('mouseleave',hideTip);
    leg.innerHTML=legend([[col(1),'Sites with a detection: 1'],[col(maxD),String(maxD)],[css('--accent-soft'),'Tested, none detected'],[css('--nodata'),'No sites tested']]);
    const pos=Object.entries(byS).filter(([,v])=>v.det).sort((a,b)=>b[1].det-a[1].det);
    const tested=d3.sum(Object.values(byS),v=>v.tested),det=d3.sum(Object.values(byS),v=>v.det);
    list.innerHTML=`<h2>${EP==='Influenza A(H5)'?'H5 bird flu':EP}</h2><p class="small">Four weeks ending ${dateFmt(D.emerging_window_end)}</p>
      <div class="sumrow"><div><span class="big">${det}</span><span class="small muted">sites with a detection</span></div><div><span class="big">${pos.length}</span><span class="small muted">states</span></div></div>
      <p class="small muted">${tested.toLocaleString()} sites tested in ${Object.keys(byS).length} states.</p>
      ${pos.length?`<ul class="emlist">${pos.map(([s,v])=>`<li><b>${esc(STATE_NAMES[s]||s)}</b> <span class="muted small">${v.det} of ${v.tested} sites</span><div class="small">${v.counties.map(([n])=>esc(n.replace(/ (County|Parish|Borough|Census Area|Municipality)$/,''))).join(' · ')}</div></li>`).join('')}</ul>`:'<p class="small">No detections in this window.</p>'}`;
  }
  el.querySelector('#em-p').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;EP=b.dataset.p;el.querySelectorAll('#em-p button').forEach(x=>x.setAttribute('aria-pressed',x===b));drawEm()});
  drawEm();
},

audit(){
  const el=document.getElementById('v-audit');
  const cls=s=>s.startsWith('PASS')?'PASS':s.startsWith('FAIL')?'FAIL':'WARN';
  el.innerHTML=`<div class="head"><h1>Audit log</h1><p class="muted">Every validation check from this run. The app only updates when no check fails.</p></div>
  <div class="statgrid"><div class="stat"><span class="label">Run</span><span class="mono">${R.run_id}</span></div><div class="stat"><span class="label">Gate</span><span class="big" style="font-size:1.2rem">${R.gate_status.replace(/_/g,' ')}</span></div><div class="stat"><span class="label">Checks</span><span class="mono">${R.n_pass} pass · ${R.n_warning} warn · ${R.n_fail} fail</span></div><div class="stat"><span class="label">Same-run tables</span><span class="big" style="font-size:1.2rem;color:${R.consistency_ok?'var(--ok)':'var(--warn)'}">${R.consistency_ok?'Yes':'No'}</span></div></div>
  ${R.consistency_ok?'':'<p class="callout">This test build mixes Table07 from one pipeline run with Table13 from another (county counts differ by 1–2). The production export blocks this; rerun the pipeline once and export every table from that run.</p>'}
  <article class="panel"><div class="tbl"><table class="stack"><tr><th>Component</th><th>Status</th><th>Detail</th><th>Source</th></tr>
  ${D.audit.map(a=>{const phil=/PHIL/.test(a.component)&&/PARTIAL_IMAGES/.test(a.status);return `<tr><td class="lead">${esc(a.component)}</td><td class="status-${phil?'INFO':cls(a.status)}" style="white-space:nowrap;font-weight:600">${phil?'INFO · OPTIONAL':esc(a.status.replace(/_/g,' '))}</td><td class="small" style="max-width:52ch;overflow-wrap:anywhere">${esc(a.detail).replace(/; /g,';<wbr> ')}${phil?'. Optional photos from CDC’s image library (PHIL), which blocks automated downloads; no analysis uses them.':''}</td><td class="small muted" data-l="Source">${esc(a.source)}</td></tr>`}).join('')}</table></div></article>
  <p class="note srcline"><b>Sources.</b> Checks are generated by the pipeline itself during the run (validation summary and per-table audits), together with export-time consistency checks that confirm every table in this build came from the same run. Nothing on this page is entered by hand. The run identifier and data-through date shown in the header identify the snapshot these results describe, and each week&rsquo;s log is archived with its tables and figures as a permanent release.</p>`;
},

glossary(){
  const el=document.getElementById('v-glossary');
  const G=[
   ['Global coverage',[
    ['global-coverage','Global coverage','How much of a country’s population wastewater surveillance could observe at all, which depends on how many people are connected to a sewer. It is a ceiling on the method, measured before asking whether a program exists.'],
    ['sewer-connected','Sewer-connected population','The share of people whose household waste reaches a sewer system rather than a septic tank, pit latrine, or no sanitation. Only this share can ever be seen by testing wastewater, however good the laboratory is.'],
    ['observable-population','Observable population','Population multiplied by the sewer-connected share — the number of people a perfectly run wastewater program in that country could detect. The remainder is invisible to the method regardless of funding.'],
    ['income-group','Income group','The World Bank classification of countries as low, lower-middle, upper-middle or high income. Shown here because sewer connection and surveillance capacity both track it closely, which is the central finding of this page.'],
    ['jmp','WHO/UNICEF JMP','The Joint Monitoring Program for Water Supply, Sanitation and Hygiene — the standard international source for how many people in each country have sewer connections. It supplies the denominator for this page.'],
    ['open-feed','Open machine-readable feed','A national program that publishes its wastewater data in a form software can read directly, under a license permitting reuse. Very few do. A dashboard a human can look at is not a feed; being listed here means the data can be downloaded and recomputed.'],
    ['insdc','INSDC / NCBI Virus / GenBank','The International Nucleotide Sequence Database Collaboration and its public archives. Sequences here are in the public domain and may be redistributed, which is why every sequence and phylogenetic tree shown on this site comes from them.'],
    ['gisaid','GISAID','A widely used virus sequence database, including wastewater-relevant collections and phylogenetic trees. Its Database Access Agreement does not permit redistributing data — or anything derived from it — through another portal, so GISAID data is not shown anywhere on this site. It may be used in published research with acknowledgement, and is cited there instead.'],
    ['phylogenetic-tree','Phylogenetic tree','A branching diagram showing how versions of a virus are related by descent, used to tell whether cases share a common origin or arrived separately.'],
   ]],
   ['Lead time & forecasting',[
    ['shedding-lead','Shedding lead','How many weeks wastewater activity rises before emergency-department visits do. This is the figure most often quoted as “wastewater gives one to three weeks of warning.” On its own it describes biology, not usable warning time, because it ignores how long the measurement takes to become public.'],
    ['reporting-lag','Reporting lag','How many weeks pass between a sample being collected and its value appearing in the public CDC dataset. Measured from the dataset’s own update timestamp against the latest sample week it contains. This is a property of the data pipeline, not of the virus.'],
    ['operational-lead','Operational lead','Shedding lead minus reporting lag — the only one of the three that answers whether a health department could actually have acted on the signal before the clinical rise. It can be zero or negative. When it is, the signal existed but became public too late to use, which is why this site reports all three terms separately instead of one headline number.'],
    ['forecast-skill','Forecast skill','One minus the error of a model divided by the error of simple persistence (assuming next week looks like this week). Above zero, the model beat persistence; below zero, it did worse. Skill below zero is reported here as readily as skill above it.'],
    ['forecast-ledger','Forecast ledger','Every run writes its predictions, tagged with that run’s ID, before the outcome exists. Later runs score them against what actually happened. Because a prediction already on the ledger is never rewritten, the scoreboard cannot be adjusted after the fact to look better than it was.'],
   ]],
   ['Coverage & representativeness',[
    ['representativeness','Representativeness','How much of a county is actually inside a monitored sewershed, and whether the monitored part resembles the county as a whole. Combines sewer share with a social-vulnerability gap. Wastewater surveillance only observes people connected to a monitored sewer, so a county can be “covered” on a map while most of its residents are invisible to the system.'],
    ['sewer-share','Sewer share','The population served by the monitored sites in a county, divided by the county’s population. A county with one small plant in a large rural county can have a very low sewer share while still appearing as a monitored county.'],
    ['svi-gap','SVI gap','A county’s social vulnerability minus the population-weighted average vulnerability of the monitored counties in its state. A positive gap means this county is more vulnerable than the places its state is actually watching.'],
    ['dormant-site','Dormant site','A site whose most recent sample is more than eight weeks old relative to the newest sample anywhere in the run. This describes reporting, not the facility: a dormant site may still be operating and simply not reporting to CDC NWSS.'],
    ['attrition','Coverage attrition','Sites that stopped reporting, when they stopped, and how many people they had been covering. This can only be measured because every weekly run is frozen and kept; a system that overwrites its own values cannot reconstruct when coverage was lost.'],
   ]],
   ['Data & updates',[
    ['latest-sample','Latest sample','The most recent date a wastewater sample was collected in this week’s CDC data. Samples take several days to be tested and reported, so it is usually a few days before the update date.'],
    ['cdc-updated','CDC data updated','When CDC last refreshed its public wastewater datasets. NWGS Grid™ pulls them every Saturday morning (Central time) and rebuilds the site.'],
    ['validated','Validated (checks passed)',`Every weekly run passes through ${R.n_pass+R.n_warning+R.n_fail} automated quality checks before anything is published: data parsing, county counts, pathogen independence, spatial and model audits, and cross-table consistency. “${R.n_pass} checks passed” means those checks found no problem. Warnings are listed on the Audit log with an explanation. If any check fails, the site keeps last week’s data instead of publishing.`],
    ['run-id','Run ID','A label for one weekly snapshot of the data (for example run_20261009T1509Z). Every number on the site comes from the same run, so tables and charts always agree. Cite it with the data-through date.'],
    ['window','Four-week window','Levels and alerts summarize the latest four weeks of samples, which smooths out single noisy samples.'],
    ['release','Release (weekly archive)','A permanent, downloadable copy of a week’s tables, figures and log on GitHub, used to cite exact numbers later.']]],
   ['Wastewater basics',[
    ['nwss','NWSS','CDC’s National Wastewater Surveillance System, which collects test results from wastewater treatment plants across the U.S.'],
    ['site','Site (sewershed)','A wastewater treatment plant or sampling point. Its sewershed is the area whose sewage flows to it; one site can serve several counties.'],
    ['county-rep','Counties represented','Counties served by at least one reporting site.'],
    ['concentration','Concentration (log)','The amount of a virus’s genetic material per volume of wastewater, put on a log scale because values vary over a huge range.'],
    ['ed','ED visits (NSSP)','The share of emergency-department visits for COVID-19, flu or RSV, from CDC’s National Syndromic Surveillance Program. Used as the clinical comparison.']]],
   ['Activity levels',[
    ['z','Median site z (z-score)','How far a site’s recent level is from its own normal, in standard deviations. Each site is compared only with its own history, then the median is taken across a county’s or the nation’s sites. 0 is typical; +1 is one standard deviation above normal.'],
    ['levels','Very Low · Low · Typical · Elevated · High','Very Low ≤ −1, Low ≤ −0.25, Typical ≤ 0.25, Elevated ≤ 1, High > 1 (median site z). They describe relative change, not case counts.'],
    ['high-now','High now','Number of counties at High (z above 1) in the latest four weeks.'],
    ['trend','Trend · change vs previous window','Increasing, Stable or Decreasing, based on how the national median z changed from the previous four weeks.']]],
   ['Emerging pathogens',[
    ['emerging','Emerging pathogens','H5 bird flu (avian influenza A(H5)), measles and mpox. CDC reports them as detected or not detected rather than as levels.'],
    ['detection-rate','Share of sites with a detection','Of the sites that tested for a pathogen in a week, the percentage with at least one positive sample.'],
    ['h5','H5 (avian influenza A(H5))','A bird-flu subtype. A wastewater detection can come from animal sources such as milk or birds, not only people.']]],
   ['Timing & seasons',[
    ['spearman','Spearman ρ (rho)','A correlation from −1 to 1 measuring how closely wastewater and ED visits rise and fall together. Above 0.7 is strong.'],
    ['lag','Lag · same week · wastewater leads','The shift in weeks that best lines up wastewater with ED visits. Same week = 0; “wastewater leads by 1” means wastewater rose a week earlier.'],
    ['fdr','FDR (false discovery rate)','A correction for running many statistical tests at once, so a few results don’t look significant just by chance.'],
    ['season','Season · seasonal peak','A July–June respiratory season, and the week activity was highest within it.'],
    ['lead-flag','Lead (weeks) · ⚑ flag','Weeks between the wastewater peak and the clinical peak. Positive = wastewater peaked first. ⚑ marks implausible leads, such as peaks falling in two different waves.']]],
   ['Maps & clusters',[
    ['morans','Moran’s I','A measure from −1 to 1 of whether neighboring counties have similar activity. Higher means stronger geographic clustering.'],
    ['lisa','Spatial clusters (LISA)','High-High: a high county surrounded by high neighbors (a hotspot). Low-Low: a cold spot. High-Low and Low-High: outliers. Shown only when statistically significant.'],
    ['coverage','Coverage · surveillance weeks','How many weeks a county has had usable wastewater data.'],
    ['analysis-ready','Analysis-ready','A county with at least 52 qualifying weeks and at least 70% completeness over its active period.']]],
   ['Equity',[
    ['svi','SVI (Social Vulnerability Index)','CDC/ATSDR’s 0-to-1 ranking of how vulnerable a county is to health emergencies, based on income, housing, language, transportation and more. Higher = more vulnerable.'],
    ['quartile','SVI quartile','Counties split into four equal groups by SVI, from lowest to highest vulnerability.'],
    ['or','Odds ratio (OR) · 95% CI · p value','From a statistical model (GLM): OR below 1 means more vulnerable counties are less likely to have analysis-ready surveillance. The 95% CI is the plausible range; p below 0.05 is conventionally significant.']]],
   ['Predictive models',[
    ['r2','R² (held-out)','The share of week-to-week variation in ED visits a model explains on later weeks it never saw. 1 is perfect; below 0 is worse than guessing the average.'],
    ['persistence','Clinical only (persistence)','A baseline that predicts next week’s ED visits from recent ED visits alone.'],
    ['ww-only','Wastewater only · full model · gain','Wastewater only uses just wastewater features; the full (multimodal) model uses both. Gain is how much the full model improves on persistence.'],
    ['shap','SHAP (top predictors)','A method that shows how much each input contributed to the model’s predictions.']]],
   ['Protein structures & annotations',[
    ['region','Functional region','A named stretch of a protein that does a particular job, such as a domain or a binding site. NWGS Grid™ imports these from UniProt rather than predicting them.'],
    ['uniprot','UniProt / accession','The reference database of protein sequences and curated annotations. An accession such as P0DTC2 is one protein’s permanent identifier.'],
    ['domain','Domain','A self-contained, independently folding part of a protein, usually with its own function.'],
    ['binding-site','Binding site','Residues a protein uses to attach to another molecule, such as a receptor on a human cell.'],
    ['residue','Residue · residue numbering','A residue is one amino-acid building block. Numbering counts along the protein chain, but a structure’s own (author) numbering can differ from UniProt’s, so ranges are converted before anything is highlighted.'],
    ['chain','Chain','One protein molecule within a structure, labeled A, B, C and so on. A spike protein, for example, is three identical chains together.'],
    ['evidence','Evidence codes','Short codes recording how an annotation was established, for example from experiment or by similarity to a studied protein.'],
    ['mapped','Mapped · not in structure','Mapped means UniProt’s region lines up with residues this structure actually resolves. Regions the structure does not cover are left out rather than approximated.']]],
   ['Genomics & structures',[
    ['amr','AMR · ARG','Antimicrobial resistance and the antibiotic-resistance genes measured in wastewater.'],
    ['ncbi','NCBI records · complete genomes','Public virus sequence records from NCBI Virus, and how many are full genomes. They are not sequences from these wastewater samples.'],
    ['pdb','PDB entry · DOI','A reference 3D protein structure in the RCSB Protein Data Bank, with its permanent citation link.'],
    ['resolution','Resolution (Å) · Cryo-EM · X-ray','How fine the structure’s detail is, in ångströms (smaller is sharper), and the lab method used to determine it.']]],
   ['Audit log',[
    ['status','PASS · WARNING · INFO · FAIL','PASS: no issue. WARNING: published, with a known limitation explained. INFO: optional item, no effect on results. FAIL: blocks publishing that week.']]]
  ];
  el.innerHTML=`<div class="head"><h1>Glossary</h1><p class="muted">Plain-language definitions of every term and label used on NWGS Grid™.</p></div>
  <div class="controls"><label class="gsearch"><span class="sr">Search terms</span><input id="g-q" type="search" placeholder="Search terms, e.g. z-score, SVI, R²"></label></div>
  <div id="g-list" class="glist">${G.map(([sec,items])=>`<article class="panel gsec"><h2>${sec}</h2><dl>${items.map(([id,term,def])=>`<div class="gitem" id="g-${id}"><dt>${term}</dt><dd>${def}</dd></div>`).join('')}</dl></article>`).join('')}</div>
  <p class="note" id="g-none" hidden>No matching terms.</p>`;
  const q=document.getElementById('g-q');
  q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();let any=false;
    el.querySelectorAll('.gsec').forEach(sec=>{let vis=0;sec.querySelectorAll('.gitem').forEach(it=>{const m=!s||it.textContent.toLowerCase().includes(s);it.hidden=!m;if(m)vis++});sec.hidden=!vis;if(vis)any=true});

methods(){
  const el=document.getElementById('v-methods');
  const acc=new Date(R.data_pulled_utc).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  el.innerHTML=`<div class="head"><h1>Methods &amp; sources</h1><p class="muted">How the numbers on this site are made, and every dataset and tool they come from.</p></div>
  <article class="panel c12"><header><h2>Methods</h2><span class="small muted">what the pipeline does, in order</span></header>
    <p>Every figure on this site is produced by one automated pipeline that runs weekly and rebuilds the whole site from a single frozen snapshot. The steps below run in this order; each is recorded in the run log, and the <a href="#audit" data-go="audit">Audit log</a> reports the result of every check.</p>
    <ol class="methodsteps">
      <li><b>Acquisition.</b> Six CDC National Wastewater Surveillance System pathogen datasets, the NSSP emergency-department series and CDC PLACES are pulled from the Socrata API on data.cdc.gov. Each dataset is saved unmodified as a frozen snapshot with its row count and the provider's own update timestamp, so the inputs to any past run can be recovered exactly.</li>
      <li><b>Harmonization.</b> The six wastewater datasets do not share a schema. Fields are mapped onto a common set of names through an explicit alias table, and the mapping actually used is written out per pathogen rather than assumed. County identifiers are normalized to five-digit FIPS, and sewersheds that span several counties are kept in their native multi-county form for coverage work instead of being forced to one county.</li>
      <li><b>Measurement selection.</b> Where a dataset offers more than one concentration measure, one is chosen by a fixed, documented hierarchy: fecal-normalized first, then flow-population-normalized, then raw. The choice is recorded per row, so no figure silently mixes measurement types.</li>
      <li><b>Within-site standardization.</b> Absolute concentrations are not comparable between sites, because laboratories, methods and sewersheds differ. Each site is therefore compared only against its own history: concentrations are log-transformed and converted to a z-score within that site, grouped by laboratory method and sample matrix. County and national figures are medians across those standardized values, never averages of raw concentrations.</li>
      <li><b>Quality control.</b> Inhibition and no-template-control flags are carried through rather than dropped, zero and negative concentrations are treated as missing before log transformation, and a sample never tested is recorded as untested rather than as a negative.</li>
      <li><b>Analysis.</b> Clinical alignment uses Spearman cross-correlation at lags of 0&ndash;6 weeks with Benjamini&ndash;Hochberg correction across all state&ndash;pathogen pairs. Spatial clustering uses global and local Moran's I on a six-nearest-neighbour graph in EPSG:5070 with permutation inference. Coverage models are binomial GLMs at county level. Forecast models are evaluated only on weeks they never saw.</li>
      <li><b>Validation gate.</b> The run passes through automated checks covering parsing, county counts, pathogen independence, spatial and model audits and cross-table consistency. Warnings are published with an explanation attached. <b>If any check fails, nothing is published and the previous week's site is kept.</b></li>
      <li><b>Publication.</b> The site is one static page built from a single export, so every table and chart on it comes from the same run. The run identifier and data-through date are shown on every page, and each week's tables, figures and log are archived as a permanent release for citation.</li>
    </ol>
    <p class="note"><b>What this pipeline does not do.</b> It does not infer or impute missing observations, estimate values for unmonitored counties, carry numbers over from a previous run, or adjust published figures after the fact. Where a source does not load, the affected panel says so and shows nothing. Where an annotation comes from an external database it is reproduced and cited rather than predicted.</p>
  </article>
  <article class="panel"><header><h2>Data sources &amp; references</h2><span class="small muted">accessed ${acc}</span></header>
  <ol class="refs">
    ${D.sources.map(s=>`<li>Centers for Disease Control and Prevention. <i>${esc(s.dataset_name)}</i> [dataset <span class="mono">${s.dataset_id}</span>]. National Wastewater Surveillance System (NWSS). data.cdc.gov; updated ${dateFmt(String(s.updated_utc).slice(0,10))}; ${s.rows.toLocaleString()} rows. <a href="${s.source_url}" target="_blank" rel="noopener">${s.source_url.replace('https://','')}</a></li>`).join('')}
    <li>Centers for Disease Control and Prevention. <i>NSSP Emergency Department Visit Trajectories by State and Sub State Regions: COVID-19, Flu, RSV, Combined</i> [dataset <span class="mono">rdmq-nq56</span>]. National Syndromic Surveillance Program. <a href="https://data.cdc.gov/d/rdmq-nq56" target="_blank" rel="noopener">data.cdc.gov/d/rdmq-nq56</a></li>
    <li>Centers for Disease Control and Prevention. <i>PLACES: Local Data for Better Health, County Data</i> [dataset <span class="mono">swc5-untb</span>]. County health context measures. <a href="https://data.cdc.gov/d/swc5-untb" target="_blank" rel="noopener">data.cdc.gov/d/swc5-untb</a></li>
    <li>Centers for Disease Control and Prevention / Agency for Toxic Substances and Disease Registry / Geospatial Research, Analysis, and Services Program. <i>CDC/ATSDR Social Vulnerability Index 2022 Database, US (county)</i>. <a href="https://www.atsdr.cdc.gov/place-health/php/svi/" target="_blank" rel="noopener">atsdr.cdc.gov/place-health/php/svi</a></li>
    <li>U.S. Census Bureau. <i>2025 TIGER/Line Shapefiles: Counties</i>. <a href="https://www.census.gov/geographies/mapping-files/time-series/geo/tiger-line-file.html" target="_blank" rel="noopener">census.gov TIGER/Line</a></li>
    <li><i>U.S. wastewater antimicrobial-resistance gene (ARG) detections, 2024</i> [file US_Wastewater_AMR_ARG_2024.csv]. Used for the resistance-gene panels. Full source citation pending.</li>
    <li>National Center for Biotechnology Information. <i>NCBI Virus</i> and <i>NCBI Datasets API v2</i>. National Library of Medicine. <a href="https://www.ncbi.nlm.nih.gov/datasets/" target="_blank" rel="noopener">ncbi.nlm.nih.gov/datasets</a></li>
    <li>Berman HM, Westbrook J, Feng Z, et al. The Protein Data Bank. <i>Nucleic Acids Research</i>. 2000;28(1):235–242. RCSB PDB entries ${D.structures.map(s=>`<a href="https://doi.org/10.2210/pdb${s.pdb_entry_id}/pdb" target="_blank" rel="noopener">${s.pdb_entry_id}</a>`).join(', ')}. <a href="https://www.rcsb.org" target="_blank" rel="noopener">rcsb.org</a></li>
    <li>Bostock M. <i>us-atlas</i>: U.S. state and county boundaries in TopoJSON, derived from U.S. Census Bureau cartographic boundary files. ISC License. <a href="https://github.com/topojson/us-atlas" target="_blank" rel="noopener">github.com/topojson/us-atlas</a></li>
    <li>Bostock M, Ogievetsky V, Heer J. D³: Data-Driven Documents. <i>IEEE Transactions on Visualization and Computer Graphics</i>. 2011;17(12):2301–2309. Also used: topojson-client (ISC).</li>
    <li>Rego N, Koes D. 3Dmol.js: molecular visualization with WebGL. <i>Bioinformatics</i>. 2015;31(8):1322–1324.</li>
  </ol>
  <p class="small muted">All CDC, Census, NCBI and RCSB data are public and remain subject to their providers’ terms. NWGS Grid™ is not affiliated with or endorsed by CDC.</p></article>
  <div class="grid"><article class="panel c12"><h2>Measures</h2><ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
    <li><b>Activity level</b> — within-site z-score of log concentration, median across a county’s sites for the latest 4 weeks. Very Low ≤ −1, Low ≤ −0.25, Typical ≤ 0.25, Elevated ≤ 1, High &gt; 1.</li>
    <li><b>Analysis-ready</b> — at least 52 qualifying weeks and at least 70% completeness across the active span.</li>
    <li><b>Timing</b> — Spearman correlation between state wastewater and ED activity at lags of 0–6 weeks, FDR-corrected; best lag reported.</li>
    <li><b>Seasonal peaks</b> — complete July–June seasons only; leads near season boundaries are flagged.</li>
    <li><b>Clusters</b> — global and local Moran’s I, k=6 nearest neighbours, EPSG:5070, permutation inference.</li>
    <li><b>Models</b> — random forest and gradient boosting vs. clinical persistence on a chronological holdout; ablation, wastewater-only benchmark and SHAP.</li></ul></article></div>
  <p class="note">The site is one static page generated from the weekly pipeline export. It is rebuilt every Saturday after CDC’s weekly NWSS refresh, and only when no validation check fails.</p>`;
}
};

function alertRow(a){return `<div class="alert"><span class="bar sev-${a.severity}"></span><div style="min-width:0;display:flex;flex-direction:column;gap:3px"><div class="meta"><b style="color:var(--ink)">${esc(a.alert_type)}</b>${a.pathogen?`<span>${esc(a.pathogen)}</span>`:''}${a.geography?`<span>${esc(a.geography)}</span>`:''}</div><p class="small">${isoTxt(a.message)}</p></div></div>`}

const RCOL=['#c49a4a','#1d4f91','#6e1f2b','#2e7d4f','#b4630f','#5b3b8c','#0f766e','#a3123a'];

/* ---------- accounts (Supabase) ---------- */
const SUPA_CFG = JSON.parse(document.getElementById('supa').textContent||'null');
let SB=null, USER=null;
try{ if(SUPA_CFG&&window.supabase) SB=window.supabase.createClient(SUPA_CFG.url,SUPA_CFG.publishableKey,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}}) }catch(e){SB=null}
const STATE_NAMES=Object.fromEntries(statesFeat.map(f=>[STATE_FIPS[f.id],f.properties.name]).filter(([k])=>k));
const RANK={'Very Low':0,'Low':1,'Typical':2,'Elevated':3,'High':4};
function drawAcct(){const el=document.getElementById('acct');if(!el)return;
  if(!SB){el.innerHTML='';return}
  el.innerHTML=USER?`<span class="small">${esc(USER.email)}</span> · <button id="acct-out">Sign out</button>`:`<button data-go="myalerts">Sign in</button>`;
  const o=document.getElementById('acct-out');if(o)o.onclick=async()=>{await SB.auth.signOut()}}
function rerender(v){delete built[v];if(!document.getElementById('v-'+v).hidden){RENDER[v]();built[v]=true}}
if(SB){
  SB.auth.onAuthStateChange((ev,session)=>{const u=session?.user||null;const changed=(u?.id||null)!==(USER?.id||null);USER=u;drawAcct();
    if(ev==='SIGNED_IN'&&/[?&]code=/.test(location.search)){try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}}
    if(changed){setTimeout(()=>{rerender('myalerts');rerender('about')},0)}});
}
const formMsg=(el,ok,text)=>{el.className='msg '+(ok?'ok':'err');el.textContent=text;el.hidden=false};
function levelNow(rule){const a=D.activity[rule.pathogen]||{};
  if(rule.area_type==='county'){const v=a[rule.area_code];return v?`${level(v[0])} now (z ${fmt(v[0])})`:'No recent data'}
  const hits=Object.entries(a).filter(([f,v])=>D.names[f]?.[1]===rule.area_code&&RANK[level(v[0])]>=RANK[rule.min_level]).length;
  return hits?`${hits} ${hits>1?'counties':'county'} at ${rule.min_level==='High'?'High':'Elevated or High'} now`:'None at that level now'}

/* ---------- boot ---------- */
drawAcct();
let start=location.hash.slice(1);
if(!start){try{start=localStorage.getItem('nwgs_view')||''}catch(e){}}
go(start||'dashboard',false);
addEventListener('hashchange',()=>go(location.hash.slice(1),false));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{Object.keys(built).forEach(k=>delete built[k]);go(location.hash.slice(1)||'dashboard',false)});
new MutationObserver(()=>{Object.keys(built).forEach(k=>delete built[k]);go(location.hash.slice(1)||'dashboard',false)}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
